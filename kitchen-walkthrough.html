<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Kitchen Walkthrough — Kitchen A vs B</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1c1a17">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root{
    --ink:#1c1a17; --panel:rgba(28,26,23,.82); --paper:#f5f2ec;
    --accent:#c8a24a; --line:rgba(245,242,236,.16);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#0e0d0b;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--paper)}
  #app{position:fixed;inset:0}
  canvas{display:block}

  #hud{position:fixed;top:14px;left:14px;z-index:10;width:236px;
    background:var(--panel);backdrop-filter:blur(10px);
    border:1px solid var(--line);border-radius:10px;padding:14px 14px 12px}
  #hud.collapsed{width:auto;padding:10px 14px}
  #hud.collapsed #hudBody{display:none}
  #hud.collapsed .sub{display:none;margin:0}
  #hudToggle{position:absolute;top:12px;left:12px;width:22px;height:22px;
    border:1px solid var(--line);border-radius:6px;background:transparent;
    color:rgba(245,242,236,.7);cursor:pointer;font-size:12px;line-height:1}
  #hud{position:fixed}
  #hud h1{font-size:13px;padding-left:30px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    color:var(--paper);margin-bottom:2px}
  #hud .sub{font-size:11px;padding-left:30px;color:rgba(245,242,236,.55);margin-bottom:10px}
  .seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .seg button{flex:1;padding:8px 0;font-size:12px;font-weight:600;background:transparent;
    color:rgba(245,242,236,.6);border:0;cursor:pointer;transition:background .15s,color .15s}
  .seg button.on{background:var(--accent);color:var(--ink)}
  #optdesc{font-size:11px;line-height:1.45;color:rgba(245,242,236,.7);margin:9px 0 10px;min-height:44px}
  .row2{display:flex;gap:6px}
  .row2 button{flex:1;padding:6px 0;font-size:11px;font-weight:600;border-radius:7px;
    border:1px solid var(--line);background:transparent;color:rgba(245,242,236,.75);cursor:pointer}
  .row2 button.on{border-color:var(--accent);color:var(--accent)}
  #hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:10;
    font-size:12px;color:rgba(245,242,236,.85);background:var(--panel);
    border:1px solid var(--line);border-radius:999px;padding:8px 16px;white-space:nowrap}
  /* Enter-VR button: hidden until a WebXR immersive-vr device is confirmed */
  #btnVR{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);z-index:12;
    display:none;padding:13px 30px;font-size:14px;font-weight:700;letter-spacing:.07em;
    text-transform:uppercase;border-radius:999px;border:1px solid var(--accent);
    background:var(--accent);color:var(--ink);cursor:pointer;
    box-shadow:0 6px 24px rgba(0,0,0,.45)}
  #btnVR.unavail{background:transparent;color:rgba(245,242,236,.6);
    border-color:var(--line);cursor:default;font-weight:600;text-transform:none;
    letter-spacing:0;font-size:12px;padding:9px 18px;box-shadow:none}
  body.xr #hud, body.xr #map, body.xr #hint, body.xr #stick{display:none}
  body.xr #btnVR{background:transparent;color:var(--accent)}
  body.xr #fin{display:none}
  /* finish editor */
  #fin{position:fixed;left:14px;bottom:14px;z-index:11;width:262px;display:none;
    background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);
    border-radius:10px;padding:12px}
  #fin h2{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
    color:rgba(245,242,236,.55);margin-bottom:7px}
  #finKind{font-size:14px;font-weight:600;color:var(--accent);margin-bottom:8px}
  #finSw{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-bottom:9px}
  #finSw button{aspect-ratio:1;border-radius:4px;border:1px solid rgba(0,0,0,.35);
    cursor:pointer;padding:0}
  #finSw button:hover{outline:2px solid var(--accent);outline-offset:1px}
  #finStyles{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
  #finStyles button{padding:5px 9px;font-size:11px;border-radius:6px;cursor:pointer;
    border:1px solid var(--line);background:transparent;color:rgba(245,242,236,.75)}
  #finStyles button.on{border-color:var(--accent);color:var(--accent)}
  #finScope{display:flex;gap:6px;margin-bottom:9px}
  #finScope button{flex:1;padding:5px 0;font-size:11px;border-radius:6px;cursor:pointer;
    border:1px solid var(--line);background:transparent;color:rgba(245,242,236,.75)}
  #finScope button.on{border-color:var(--accent);color:var(--accent)}
  #finRow{display:flex;gap:6px;align-items:center}
  #finRow input[type=color]{width:34px;height:26px;padding:0;border:1px solid var(--line);
    border-radius:6px;background:transparent;cursor:pointer}
  #finRow button{flex:1;padding:6px 0;font-size:11px;border-radius:6px;cursor:pointer;
    border:1px solid var(--line);background:transparent;color:rgba(245,242,236,.75)}
  #finHint{font-size:11px;line-height:1.45;color:rgba(245,242,236,.6)}
  #map{position:fixed;top:14px;right:14px;z-index:10;border-radius:10px;
    border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(10px)}
  #stick{position:fixed;z-index:9;width:110px;height:110px;border-radius:50%;
    border:1.5px solid rgba(245,242,236,.35);display:none;pointer-events:none}
  #knob{position:absolute;width:44px;height:44px;border-radius:50%;
    background:rgba(245,242,236,.45);left:33px;top:33px}
  @media (max-width:640px){ #hud{width:200px} #hint{font-size:11px} }
</style>
</head>
<body>
<div id="app"></div>
<canvas id="plan" style="position:fixed;inset:0;z-index:5;display:none;background:#f7f4ee"></canvas>

<div id="hud">
  <button id="hudToggle" title="Collapse">&#8211;</button>
  <h1>Kitchen Walkthrough</h1>
  <div class="sub">From plans S2.2 · 1/4" = 1'-0"</div>
  <div id="hudBody">
  <div class="seg">
    <button id="btnA" class="on">Kit A</button>
    <button id="btnA2">Kit A&#8242;</button>
    <button id="btnB">Kit B</button>
  </div>
  <div id="optdesc"></div>
  <div class="seg" style="margin-bottom:9px">
    <button id="btnFamA" class="on">Fam A</button>
    <button id="btnFamB">Fam B</button>
    <button id="btnFamB2">Fam B&#8242;</button>
  </div>
  <div class="row2">
    <button id="btnWalk" class="on">Walk</button>
    <button id="btnOver">3D top</button>
    <button id="btnPlan">2D plan</button>
  </div>
  <div class="row2" style="margin-top:6px">
    <button id="btnOak" class="on">Oak island</button>
    <button id="btnNavy">Navy island</button>
  </div>
  <div class="row2" style="margin-top:6px">
    <button id="btnPdfFloor">Plan floor</button>
    <button id="btnXray">X-ray</button>
  </div>
  <div class="row2" style="margin-top:6px">
    <button id="btnFinish">Finishes</button>
  </div>
  <div style="margin-top:9px;font-size:10px;letter-spacing:.05em;color:rgba(245,242,236,.55)">
    LENS <span id="fovval" style="float:right;color:rgba(245,242,236,.8)">56&deg;</span></div>
  <input id="fov" type="range" min="42" max="75" value="56"
    style="width:100%;accent-color:var(--accent);margin-top:3px">
  </div>
</div>

<canvas id="map" width="220" height="150"></canvas>
<div id="hint">Drag to look around · WASD / arrows to move · Shift runs</div>
<button id="btnVR">Enter VR</button>

<div id="fin">
  <h2>Finishes</h2>
  <div id="finKind"></div>
  <div id="finHint">Click anything in the room to pick its finish.</div>
  <div id="finStyles"></div>
  <div id="finScope">
    <button id="finAll" class="on">All walls</button>
    <button id="finOne">Just this wall</button>
  </div>
  <div id="finSw"></div>
  <div id="finRow">
    <input type="color" id="finPick" value="#e8e2d6" title="Custom colour">
    <button id="finCopy">Copy link</button>
    <button id="finReset">Reset all</button>
  </div>
</div>
<div id="stick"><div id="knob"></div></div>
<div id="toast" style="position:fixed;right:14px;bottom:14px;z-index:20;display:none;
  max-width:280px;background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:9px 13px;font-size:11px;line-height:1.45;color:rgba(245,242,236,.85)"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================
   Kitchen walkthrough — Options A & B from TY Eng plans (S2.2)
   Units authored in FEET, converted to meters (WebXR-safe so a
   VRButton + renderer.xr.enabled can be added later for Quest 2).
   Axes: +X = east (right on plan), +Z = south (down), +Y = up.
   Origin: NW interior corner of the kitchen zone.
   ============================================================ */
const F = ft => ft * 0.3048;
const CEIL = 9, WALL_T = 0.45;
const KCEIL = 8;   // kitchen-zone ceiling only — Jim: the kitchen is 8', the rest is not
// Finished counter height 36". The base carcass must reach the underside of the
// slab — a shorter carcass leaves the top visibly floating on nothing.
const CT_H = 3.0, CT_T = 0.13, BASE_H = CT_H - CT_T;   // 3.00 / 0.13 / 2.87
// Plan-sheet registration. The embedded crops cover raster px (713,1601)-(3813,4201)
// at 50 px/ft. Line-scanning reference/*-200dpi.png puts the model origin (interior
// NW corner of the kitchen) at raster px (1932,1899) — the old (1913,1901) drew the
// sheet 0.38ft west of the model, which is why walls never landed on their outlines.
const PLAN_X0=-24.38, PLAN_X1=37.62, PLAN_Z0=-5.96, PLAN_Z1=46.04;

/* ---------- palette / materials ---------- */
const M = {};
function makeMaterials(){
  M.wall   = new THREE.MeshLambertMaterial({color:0xa9a59b});   // greige per photo
  M.trimW  = new THREE.MeshLambertMaterial({color:0xf4f3ef});   // white door/window trim
  M.wallX  = new THREE.MeshLambertMaterial({color:0x8f8b82});   // exterior faces
  M.ceil   = new THREE.MeshLambertMaterial({color:0xf7f4ee});
  M.cab    = new THREE.MeshLambertMaterial({color:0xf0ede6});   // white shaker cabinets
  M.cabIslOak  = new THREE.MeshLambertMaterial({color:0xa8875a}); // warm white-oak island
  M.cabIslNavy = new THREE.MeshLambertMaterial({color:0x34455a}); // navy island
  M.top    = new THREE.MeshPhongMaterial({color:0xf7f5f0,shininess:70});
  M.steel  = new THREE.MeshPhongMaterial({color:0xc2c7cd,shininess:95});
  M.appl   = new THREE.MeshPhongMaterial({color:0xffffff,shininess:110}); // appliance stainless
  M.applDk = new THREE.MeshPhongMaterial({color:0x4a4f57,shininess:60});  // reveals / carcass
  M.basin  = new THREE.MeshPhongMaterial({color:0x9aa0a7,shininess:70});  // sink bowl
  M.applGl = new THREE.MeshPhongMaterial({color:0x14161a,shininess:120}); // oven & cooktop glass
  M.brass  = new THREE.MeshPhongMaterial({color:0xb08d46,shininess:85});
  M.black  = new THREE.MeshPhongMaterial({color:0x22242a,shininess:30});
  // Split out of M.brass / the inline rug so the finish editor can drive each
  // independently — faucet finish and cabinet hardware are separate decisions.
  M.faucet = new THREE.MeshPhongMaterial({color:0xb08d46,shininess:85});
  M.lamp   = new THREE.MeshPhongMaterial({color:0x6b6f63,shininess:40});
  M.rug    = new THREE.MeshLambertMaterial({color:0x9c8a74});
  M.wood   = new THREE.MeshLambertMaterial({color:0xb08d5e});
  M.woodDk = new THREE.MeshLambertMaterial({color:0x7d6140});
  M.cushion= new THREE.MeshLambertMaterial({color:0xb9a98d});
  M.cushB  = new THREE.MeshLambertMaterial({color:0x8494a3});   // gray-blue banquette cushion
  M.sofa   = new THREE.MeshLambertMaterial({color:0x4f7194});   // Interior Define "Azure"
  M.pillow = new THREE.MeshLambertMaterial({color:0xefece4});
  M.woven  = new THREE.MeshLambertMaterial({color:0xc7ab7d});   // woven roman shades
  M.glass  = new THREE.MeshPhongMaterial({color:0xbfd9e6,transparent:true,opacity:0.28,shininess:100});
  M.frame  = new THREE.MeshLambertMaterial({color:0x2e2e2e});
  M.door   = new THREE.MeshLambertMaterial({color:0xf2f1ed});
  M.lightE = new THREE.MeshBasicMaterial({color:0xfff6dd});
  // oak plank floor via canvas texture
  const c = document.createElement('canvas'); c.width=512; c.height=512;
  const g = c.getContext('2d');
  g.fillStyle='#d8c9ae'; g.fillRect(0,0,512,512);
  for(let i=0;i<8;i++){
    const y=i*64;
    g.fillStyle = `rgba(${198+Math.random()*24|0},${184+Math.random()*20|0},${158+Math.random()*16|0},0.6)`;
    g.fillRect(0,y,512,62);
    g.fillStyle='rgba(128,112,90,.4)'; g.fillRect(0,y+62,512,2);
    g.fillStyle='rgba(128,112,90,.28)';
    g.fillRect(((i*197)%512),y,2,62);
    for(let k2=0;k2<9;k2++){
      g.strokeStyle=`rgba(134,116,92,${0.08+Math.random()*0.1})`;
      g.lineWidth=0.8+Math.random();
      g.beginPath(); const gy=y+4+Math.random()*54;
      g.moveTo(0,gy);
      for(let gx=0;gx<=512;gx+=64) g.lineTo(gx,gy+Math.sin(gx/90+k2)*1.6);
      g.stroke();
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(6,6);
  M.floor = new THREE.MeshLambertMaterial({map:tex});
  // white subway tile backsplash
  const tc = document.createElement('canvas'); tc.width=256; tc.height=256;
  const tg = tc.getContext('2d');
  tg.fillStyle='#f4f2ec'; tg.fillRect(0,0,256,256);
  tg.strokeStyle='rgba(160,155,145,.55)'; tg.lineWidth=2;
  for(let r=0;r<8;r++){
    tg.beginPath(); tg.moveTo(0,r*32); tg.lineTo(256,r*32); tg.stroke();
    const off=(r%2)*32;
    for(let cx2=off;cx2<=256;cx2+=64){ tg.beginPath(); tg.moveTo(cx2,r*32); tg.lineTo(cx2,r*32+32); tg.stroke(); }
  }
  const ttex=new THREE.CanvasTexture(tc);
  ttex.wrapS=ttex.wrapT=THREE.RepeatWrapping; ttex.repeat.set(5,1.6);
  M.tile = new THREE.MeshLambertMaterial({map:ttex});
  // grayed deck planks
  const dc = document.createElement('canvas'); dc.width=512; dc.height=512;
  const dg = dc.getContext('2d');
  dg.fillStyle='#8d7a63'; dg.fillRect(0,0,512,512);
  for(let i=0;i<10;i++){
    const y=i*51;
    dg.fillStyle=`rgba(${115+Math.random()*25|0},${98+Math.random()*20|0},${76+Math.random()*15|0},.6)`;
    dg.fillRect(0,y,512,49);
    dg.fillStyle='rgba(40,32,22,.55)'; dg.fillRect(0,y+49,512,3);
  }
  const dtex = new THREE.CanvasTexture(dc);
  dtex.wrapS=dtex.wrapT=THREE.RepeatWrapping; dtex.repeat.set(5,5);
  M.deck  = new THREE.MeshLambertMaterial({map:dtex});
  M.grass = new THREE.MeshLambertMaterial({color:0x86a35f});
  M.rail  = new THREE.MeshLambertMaterial({color:0x6e5a43});
  { // dry-stacked tan ledgestone per family-room photo
    const sc2=document.createElement('canvas'); sc2.width=512; sc2.height=512;
    const sg2=sc2.getContext('2d');
    sg2.fillStyle='#8d8375'; sg2.fillRect(0,0,512,512);
    const pal=['#c7bba3','#bcb096','#d2c7b0','#b0a48c','#dcd2bc','#a89c85','#c2b59b'];
    let yy=0;
    while(yy<512){
      const rh=13+Math.random()*15; let xx=-(Math.random()*50);
      while(xx<512){
        const rw=55+Math.random()*110;
        const base=pal[Math.random()*pal.length|0];
        const gr2=sg2.createLinearGradient(0,yy,0,yy+rh);
        gr2.addColorStop(0, base);
        gr2.addColorStop(1, '#a1957f');
        sg2.fillStyle=gr2;
        sg2.fillRect(xx+1.5,yy+1.5,rw-3,rh-3);
        xx+=rw;
      }
      yy+=rh;
    }
    const stex=new THREE.CanvasTexture(sc2);
    stex.wrapS=stex.wrapT=THREE.RepeatWrapping; stex.repeat.set(1.4,1.5);
    M.stone = new THREE.MeshLambertMaterial({map:stex});
  }
  M.beam  = new THREE.MeshLambertMaterial({color:0x4a3826});
  // whitewashed plank ceiling
  const pc = document.createElement('canvas'); pc.width=512; pc.height=512;
  const pg = pc.getContext('2d');
  pg.fillStyle='#e8e2d6'; pg.fillRect(0,0,512,512);
  for(let i=0;i<12;i++){
    const y=i*43;
    pg.fillStyle=`rgba(${205+Math.random()*25|0},${198+Math.random()*22|0},${185+Math.random()*18|0},.7)`;
    pg.fillRect(0,y,512,41);
    pg.fillStyle='rgba(120,110,95,.35)'; pg.fillRect(0,y+41,512,2);
  }
  const ptex = new THREE.CanvasTexture(pc);
  ptex.wrapS=ptex.wrapT=THREE.RepeatWrapping; ptex.repeat.set(3,4);
  M.plank = new THREE.MeshLambertMaterial({map:ptex});

  /* ---- detailed material maps: grain, veined quartz, plaster, weave, brushed steel ---- */
  const grainC=document.createElement('canvas'); grainC.width=1024; grainC.height=1024;
  { const gg=grainC.getContext('2d');
    gg.fillStyle='#d8b98d'; gg.fillRect(0,0,1024,1024);
    for(let i=0;i<62;i++){
      gg.strokeStyle=`rgba(108,74,42,${0.18+Math.random()*0.2})`;
      gg.lineWidth=2.2+Math.random()*3.6;
      const y0=Math.random()*1024;
      gg.beginPath(); gg.moveTo(0,y0);
      for(let x2=0;x2<=1024;x2+=28)
        gg.lineTo(x2, y0+Math.sin(x2/210+i)*7+Math.sin(x2/57+i*2)*2);
      gg.stroke();
    }
    for(let i=0;i<7;i++){
      const cx3=Math.random()*1024, cy3=Math.random()*1024;
      gg.strokeStyle='rgba(108,74,42,0.2)'; gg.lineWidth=1.8;
      for(let r=14;r<170;r+=13){
        gg.beginPath(); gg.ellipse(cx3,cy3,r*2.7,r,0,0,Math.PI*2); gg.stroke();
      }
    }
  }
  const plasterC=document.createElement('canvas'); plasterC.width=512; plasterC.height=512;
  { const pg2=plasterC.getContext('2d');
    pg2.fillStyle='#f4f2ee'; pg2.fillRect(0,0,512,512);
    for(let i=0;i<26000;i++){
      const l=232+Math.random()*23|0;
      pg2.fillStyle=`rgba(${l},${l-2},${l-5},0.5)`;
      pg2.fillRect(Math.random()*512,Math.random()*512,1.3,1.3);
    }
  }
  const veinC=document.createElement('canvas'); veinC.width=1024; veinC.height=1024;
  { const vg=veinC.getContext('2d');
    vg.fillStyle='#f6f4ef'; vg.fillRect(0,0,1024,1024);
    for(let i=0;i<9;i++){
      let vx=Math.random()*1024, vy=Math.random()*1024;
      let a=Math.random()*Math.PI*2;
      const pts=[[vx,vy]];
      for(let st=0;st<40;st++){
        a+=(Math.random()-0.5)*0.7;
        vx+=Math.cos(a)*34; vy+=Math.sin(a)*34;
        pts.push([vx,vy]);
      }
      for(const [w2,al] of [[13,0.16],[6,0.28],[2,0.5]]){
        vg.strokeStyle=`rgba(122,124,134,${al})`; vg.lineWidth=w2;
        vg.beginPath(); vg.moveTo(pts[0][0],pts[0][1]);
        for(const pt of pts) vg.lineTo(pt[0],pt[1]);
        vg.stroke();
      }
    }
    for(let i=0;i<1800;i++){
      const l=222+Math.random()*20|0;
      vg.fillStyle=`rgba(${l},${l},${l-4},0.35)`;
      vg.fillRect(Math.random()*1024,Math.random()*1024,2,2);
    }
  }
  const weaveC=document.createElement('canvas'); weaveC.width=128; weaveC.height=128;
  { const wg=weaveC.getContext('2d');
    wg.fillStyle='#efedea'; wg.fillRect(0,0,128,128);
    for(let i=0;i<128;i+=4){
      wg.fillStyle='rgba(140,135,128,0.22)'; wg.fillRect(0,i,128,1.4);
      wg.fillStyle='rgba(255,255,255,0.28)'; wg.fillRect(i,0,1.4,128);
    }
  }
  const brushC=document.createElement('canvas'); brushC.width=256; brushC.height=256;
  { const bg2=brushC.getContext('2d');
    bg2.fillStyle='#eceef1'; bg2.fillRect(0,0,256,256);
    for(let i=0;i<650;i++){
      const l=196+Math.random()*58|0;
      bg2.fillStyle=`rgba(${l},${l+2},${l+5},0.5)`;
      bg2.fillRect(0,Math.random()*256,256,0.7);
    }
  }
  // appliance stainless: fine VERTICAL brush + a cross-panel sheen gradient.
  // Grain must run with the door, and stay fine at any panel size — hence the
  // per-face repeat in steelFace() rather than a flat 1:1 stretch.
  const applC=document.createElement('canvas'); applC.width=512; applC.height=512;
  { const ag=applC.getContext('2d');
    const grd=ag.createLinearGradient(0,0,512,0);

function toast(msg,ms){

  t.textContent=msg; t.style.display='block';
  clearTimeout(t._h);

/* Optional photo textures: drop files in a textures/ folder next to this HTML.
   Falls back to built-in materials per file; reports misses bottom-right. */
function loadExternalTextures(){
  if(typeof location==='undefined') return;             // headless render
  const wants=[
    ['floor.jpg',   [['floor',6,6]]],
    ['stone.jpg',   [['stone',1.4,2.0]]],
    ['wood.jpg',    [['wood',1.1,1.1],['woodDk',1.4,1.4],['beam',2.4,0.5],['rail',2,1],['cabIslOak',1.2,1.2]]],
    ['quartz.jpg',  [['top',0.85,0.85]]],
    ['wall.jpg',    [['wall',5,3],['wallX',5,3]]],
    ['tile.jpg',    [['tile',5,1.6]]],
    ['ceiling.jpg', [['plank',3,4]]],
    ['fabric.jpg',  [['cushion',3,3],['cushB',4,4],['pillow',2,2],['sofa',4,4]]],
    ['steel.jpg',   [['steel',1,1]]]
  ];
  const loader=new THREE.TextureLoader();
  let done=0, ok=0; const missing=[];
  const finish=()=>{
    if(done<wants.length) return;
    if(ok===0){ toast('textures/ folder not found \u2014 using built-in materials. (Tip: Chrome blocks file:// textures; serve the folder or use a local server.)',9000); }
    else if(missing.length){ toast('Loaded '+ok+' photo textures; missing: '+missing.join(', '),8000); }
    if(ok>0) buildOption(current);                      // rebuild so fitted clones pick up new maps
  };
  for(const [file,targets] of wants){
    loader.load('textures/'+file, tex=>{
      tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
      tex.encoding=THREE.sRGBEncoding;
      for(const [k,rx,ry] of targets){
        if(!M[k]) continue;
        const t2=tex.clone(); t2.needsUpdate=true; t2.repeat.set(rx,ry);
        M[k].map=t2;
        if(M[k].bumpMap) M[k].bumpMap=t2;
        if(k==='wood'||k==='woodDk'||k==='beam'||k==='rail'||k==='cabIslOak') M[k].color.setHex(0xffffff);
        M[k].needsUpdate=true;
      }
      ok++; done++; finish();
    }, undefined, ()=>{ missing.push(file); done++; finish(); });
  }
}
function convertPBR(){
  const spec={wall:{r:.95,b:.005},wallX:{r:.95,b:.005},ceil:{r:.92,b:.004,e:.85},cab:{r:.5,b:.003},
    cabIslOak:{r:.55,b:.02},cabIslNavy:{r:.42,b:.002},ceil2:{},
    top:{cls:'phys',r:.26,cc:.55,ccr:.3,b:.005},
    steel:{r:.38,m:.75,e:1.1},brass:{r:.3,m:.9,e:1.1},black:{r:.38,m:.25},
    appl:{r:.30,m:.80,e:1.35},applDk:{r:.5,m:.6,e:.9},applGl:{cls:'phys',r:.09,m:.35,cc:.9,ccr:.06,e:1.5},
    basin:{r:.34,m:.72,e:.75},faucet:{r:.3,m:.9,e:1.1},lamp:{r:.45,m:.6,e:1.0},rug:{r:1,b:.01},
    wood:{r:.62,b:.02},woodDk:{r:.68,b:.02},cushion:{r:1,b:.012},cushB:{r:1,b:.012},
    pillow:{r:1,b:.012},sofa:{r:1,b:.014},woven:{r:.95},door:{r:.6,b:.003},trimW:{r:.5,b:.003},frame:{r:.45,m:.5},
    rail:{r:.85,b:.015},trimDk:{r:.55,b:.003},stone:{r:.97,b:.05},beam:{r:.85,b:.02},plank:{r:.88,b:.015},
    grass:{r:1},deck:{r:.9,b:.02},floor:{r:.62,b:.012},tile:{r:.22,b:.01}};
  for(const k in spec){
    const old=M[k]; if(!old) continue;
    const o=spec[k];
    const mat = o.cls==='phys' ? new THREE.MeshPhysicalMaterial({}) : new THREE.MeshStandardMaterial({});
    if(old.color){ mat.color.copy(old.color); mat.color.convertSRGBToLinear(); }
    if(old.map){ mat.map=old.map; mat.map.encoding=THREE.sRGBEncoding;
      if(o.b){ mat.bumpMap=old.map; mat.bumpScale=o.b; } }
    mat.roughness=(o.r!==undefined)?o.r:.8;
    mat.metalness=o.m||0;
    if(o.cc!==undefined){ mat.clearcoat=o.cc; mat.clearcoatRoughness=o.ccr; }
    mat.envMapIntensity=o.e||0.5;
    M[k]=mat;
  }
  M.glass=new THREE.MeshPhysicalMaterial({color:0xd4e6ef,transparent:true,opacity:0.22,
    roughness:0.06,metalness:0,envMapIntensity:1.2});
  M.glass.color.convertSRGBToLinear();
}

/* stainless for one appliance panel: brush runs the full height (no tiling seam
   along the grain), density set by real width so a 30" door and a 6" trim strip
   read at the same grain scale */
function steelFace(wFt,hFt){
  const base=M.appl;
  if(!base.clone||!base.map) return base;
  const m=base.clone();
  m.userData = {baseKey:'appl'};
  m.map=base.map.clone(); m.map.needsUpdate=true;
  m.map.wrapS=m.map.wrapT=THREE.RepeatWrapping;
  m.map.repeat.set(Math.max(0.4,wFt/1.6), 1);
  return m;
}

/* fit a textured material's repeat to a face's real-world size (ft) */
function matFit(base,wFt,hFt,tileFt){
  if(!base.clone||!base.map) return base;
  const m2=base.clone();
  m2.userData = {baseKey: mkey(base)};   // so the finish editor can find clones
  m2.map=base.map.clone(); m2.map.needsUpdate=true;
  m2.map.repeat.set(Math.max(0.25,wFt/tileFt), Math.max(0.25,hFt/tileFt));
  if(base.bumpMap){ m2.bumpMap=m2.map; }
  return m2;
}

/* ---------- small builders (all args in feet) ---------- */
let world, solids, lights;   // world group, collision boxes, decorative lights
let movables = [];           // grabbable furniture (stools, chairs)

function box(w,h,d, mat){
  const m = new THREE.Mesh(new THREE.BoxGeometry(F(w),F(h),F(d)), mat);
  m.castShadow = m.receiveShadow = true;
  return m;
}
/* box with a per-face material so a world-scale texture keeps its scale on all
   six faces. A single material on a box stretches the map per face, which is
   what smears ledgestone into streaks on a long, short hearth. */
function boxFit(w,h,d, base, tileFt){
  const f=(a,b)=>matFit(base,a,b,tileFt);
  const m = new THREE.Mesh(new THREE.BoxGeometry(F(w),F(h),F(d)),
    [f(d,h),f(d,h), f(w,d),f(w,d), f(w,h),f(w,h)]);   // +x -x +y -y +z -z
  m.castShadow = m.receiveShadow = true;
  return m;
}
function place(mesh, x,y,z){ mesh.position.set(F(x),F(y),F(z)); world.add(mesh); return mesh; }
function solid(x,z,w,d){ solids.push({x1:F(x),z1:F(z),x2:F(x+w),z2:F(z+d)}); }

/* wall segment along X or Z with rectangular openings.
   openings: [{o:offset-from-start, w:width, sill, head}] */
function wallSeg(x,z, len, alongX, opens=[], matIn=M.wall, H=CEIL){
  opens = opens.slice().sort((a,b)=>a.o-b.o);
  let cur = 0;
  const pieces = [];
  for(const op of opens){
    if(op.o>cur) pieces.push({o:cur,w:op.o-cur,sill:0,head:H});
    if(op.sill>0)   pieces.push({o:op.o,w:op.w,sill:0,head:op.sill});
    if(op.head<H)pieces.push({o:op.o,w:op.w,sill:op.head,head:H});
    // glass + frame
    addWindow(x,z,alongX,op);
    cur = op.o+op.w;
  }
  if(cur<len) pieces.push({o:cur,w:len-cur,sill:0,head:H});
  for(const p of pieces){
    const h = p.head-p.sill;
    const m = alongX ? box(p.w,h,WALL_T,matIn) : box(WALL_T,h,p.w,matIn);
    if(alongX) place(m, x+p.o+p.w/2, p.sill+h/2, z);
    else       place(m, x, p.sill+h/2, z+p.o+p.w/2);
  }
  if(alongX) solid(x, z-WALL_T/2, len, WALL_T);
  else       solid(x-WALL_T/2, z, WALL_T, len);
}
function addWindow(x,z,alongX,op){
  if(op.noGlass) return;
  const h = op.head-op.sill, w = op.w;
  // pane tucked 0.04' inside the frame all round: shared edge planes with the
  // trim boxes were the "glitching around the sink" (the 6' window is right there)
  const g = alongX ? box(w-0.08,h-0.08,0.08,M.glass) : box(0.08,h-0.08,w-0.08,M.glass);
  g.castShadow=false;
  const fT=0.2;
  const mk = (ww,hh)=> alongX ? box(ww,hh,0.3,M.trimW) : box(0.3,hh,ww,M.trimW);
  const cx = alongX ? x+op.o+w/2 : x, cz = alongX ? z : z+op.o+w/2;
  place(g, cx, op.sill+h/2, cz);
  const top=mk(w,fT), bot=mk(w,fT);
  place(top,cx,op.head-fT/2,cz); place(bot,cx,op.sill+fT/2,cz);
  const s1=mk(fT,h), s2=mk(fT,h);
  if(alongX){ place(s1,x+op.o+fT/2,op.sill+h/2,z); place(s2,x+op.o+w-fT/2,op.sill+h/2,z); }
  else{ place(s1,x,op.sill+h/2,z+op.o+fT/2); place(s2,x,op.sill+h/2,z+op.o+w-fT/2); }
  if(op.shade){
    const v = alongX ? box(w+0.4,0.6,0.42,M.woven) : box(0.42,0.6,w+0.4,M.woven);
    place(v, cx, op.head-0.2, cz);
  }
}

/* shaker door & drawer fronts with brass knobs along a cabinet face */
function shakerRun(x,z,len,alongX,out,mat){
  mat=mat||M.cab;
  const tm=(mat===M.cab)?M.trimDk:mat;
  const D=0.065;
  const rail=(y,h)=>{
    const b=alongX?box(len,h,0.09,tm):box(0.09,h,len,tm);
    place(b, alongX?x+len/2:x+out*D, y, alongX?z+out*D:z+len/2);
  };
  rail(0.2,0.24); rail(2.19,0.10); rail(2.78,0.14);   // toe, under-drawer, top
  const n=Math.max(1,Math.round(len/1.65));
  for(let i=0;i<=n;i++){
    const pp=Math.min(len-0.05,Math.max(0.05,i*len/n));
    const st=alongX?box(0.12,2.61,0.09,tm):box(0.09,2.61,0.12,tm);
    place(st, alongX?x+pp:x+out*(D-0.012), 1.545, alongX?z+out*(D-0.012):z+pp);
  }
  const tag=(alongX?'X':'Z')+x.toFixed(2)+','+z.toFixed(2);
  for(let i=0;i<n;i++){
    const pp=(i+0.5)*len/n;
    const u0=i*len/n+0.06, u1=(i+1)*len/n-0.06;
    // door: alternate the hinge edge so neighbouring pairs open away from each other
    const atStart=(i%2===0), hu=atStart?u0:u1;
    bayDoor(tag+'d'+i, x, z, alongX, out, D, hu, atStart, u1-u0, 0.32, 2.14,
            mat, alongX?x+pp:x+out*(D+0.04), 1.95, alongX?z+out*(D+0.04):z+pp);
    bayDrawer(tag+'w'+i, x, z, alongX, out, D, u0, u1-u0, 2.24, 2.71, mat,
              alongX?x+pp:x+out*(D+0.03), 2.475, alongX?z+out*(D+0.03):z+pp);
  }
}
/* One cabinet door. (x,z) is the run's face plane, `hu` the hinge offset along
   the run, `w` the leaf width, y0..y1 its height. The knob is reparented so it
   swings with the leaf. */
function bayDoor(name, x, z, alongX, out, D, hu, atStart, w, y0, y1, mat, kx, ky, kz){
  const hx = alongX ? x+hu : x+out*D;
  const hz = alongX ? z+out*D : z+hu;
  // a leaf running away from its hinge has to swing towards `out`; the sign
  // flips with the run axis and with which edge the hinge is on
  const s = atStart ? 1 : -1;
  const ang = (alongX ? -out*s : out*s) * 1.50;
  const g = hinge(name, hx, 0, hz, 'y', ang);
  const cu = hu + s*w/2;
  const leaf = alongX ? box(w,y1-y0,0.085,mat) : box(0.085,y1-y0,w,mat);
  toHinge(g, place(leaf, alongX?x+cu:x+out*D, (y0+y1)/2, alongX?z+out*D:z+cu));
  const k = new THREE.Mesh(new THREE.SphereGeometry(F(0.05),8,8), M.brass);
  setDoorHandle(g, toHinge(g, place(k, kx, ky, kz)));
}
/* One drawer: the front slides out and drags a shallow box with it. The box
   lives inside the carcass when shut, so it costs nothing visually until you
   open it. */
function bayDrawer(name, x, z, alongX, out, D, u0, w, y0, y1, mat, px, py, pz){
  const dir = alongX ? new THREE.Vector3(0,0,out) : new THREE.Vector3(out,0,0);
  const g = hinge(name, x, 0, z, 'slide', F(0.95), dir);
  const cu = u0 + w/2;
  const front = alongX ? box(w,y1-y0,0.085,mat) : box(0.085,y1-y0,w,mat);
  toHinge(g, place(front, alongX?x+cu:x+out*D, (y0+y1)/2, alongX?z+out*D:z+cu));
  const bd = 1.15, bh = (y1-y0)-0.10;
  const bxm = alongX ? box(w-0.12,bh,bd,M.cab) : box(bd,bh,w-0.12,M.cab);
  toHinge(g, place(bxm, alongX?x+cu:x+out*(D-bd/2), (y0+y1)/2-0.03,
                        alongX?z+out*(D-bd/2):z+cu));
  const dk = new THREE.Mesh(new THREE.CylinderGeometry(F(0.035),F(0.035),F(0.5),8),M.brass);
  dk.rotation[alongX?'z':'x']=Math.PI/2;
  setDoorHandle(g, toHinge(g, place(dk, px, py, pz)));
}

/* wall outlet: white plate + rocker */
function outlet(x,z,y,alongX){
  const plate = alongX? box(0.32,0.5,0.035,M.trimW) : box(0.035,0.5,0.32,M.trimW);
  place(plate,x,y,z).castShadow=false;
  const rk = alongX? box(0.12,0.3,0.045,M.trimDk) : box(0.045,0.3,0.12,M.trimDk);
  place(rk,x,y,z).castShadow=false;
}

/* base cabinet run + countertop */
/* base run + slab. `cut` = {x,z,w,d} world-ft sink opening; the slab is then
   built as four strips around it instead of one solid piece. */
function counter(x,z,w,d,mat=M.cab,cut){
  place(box(w,BASE_H,d,mat), x+w/2, BASE_H/2, z+d/2);
  const TX=x-0.075, TZ=z-0.075, TW=w+0.15, TD=d+0.15, TY=CT_H-CT_T/2;
  const slab=(sx,sz,sw,sd)=>{
    if(sw<=0.002||sd<=0.002) return;
    place(box(sw,CT_T,sd,matFit(M.top,sw,sd,6)), sx+sw/2,TY, sz+sd/2);
  };
  if(!cut){ slab(TX,TZ,TW,TD); }
  else{
    const x1=cut.x, x2=cut.x+cut.w, z1=cut.z, z2=cut.z+cut.d;
    slab(TX, TZ, TW, z1-TZ);                 // behind the opening
    slab(TX, z2, TW, TZ+TD-z2);              // in front of it
    slab(TX, z1, x1-TX, z2-z1);              // left
    slab(x2, z1, TX+TW-x2, z2-z1);           // right
  }
  solid(x-0.1,z-0.1,w+0.2,d+0.2);
}
/* wall cabinet with shaker fronts + knobs, matching the bases. `face` is the
   side the doors are on: 'z+' 'z-' 'x+' 'x-'. */
function upper(x,z,w,d,face='z+',h=2.6,y0=4.6){
  place(box(w,h,d,M.cab), x+w/2, y0+h/2, z+d/2);
  const fx = face==='x+'?1:face==='x-'?-1:0;
  const fz = face==='z+'?1:face==='z-'?-1:0;
  const AW = fx ? d : w, D=0.065, tm=M.trimDk;
  const fpx = fx>0 ? x+w : x, fpz = fz>0 ? z+d : z;
  const P=(u,y,uw,hh,th,mat)=> fx
    ? place(box(th,hh,uw,mat), fpx+fx*(D-th/2), y, z+u)
    : place(box(uw,hh,th,mat), x+u, y, fpz+fz*(D-th/2));
  P(AW/2, y0+0.13,   AW, 0.24, 0.09, tm);            // bottom rail
  P(AW/2, y0+h-0.11, AW, 0.20, 0.09, tm);            // top rail
  const n=Math.max(1,Math.round(AW/1.6));
  for(let i=0;i<=n;i++){
    const u=Math.min(AW-0.06,Math.max(0.06,i*AW/n));
    P(u, y0+h/2, 0.12, h-0.44, 0.09, tm);            // stiles
  }
  const utag='U'+x.toFixed(2)+','+z.toFixed(2);
  for(let i=0;i<n;i++){                              // knobs, low on each door
    const u=(i+0.5)*AW/n + (i<n/2?1:-1)*(AW/n/2-0.18);
    const bu0=i*AW/n+0.06, bu1=(i+1)*AW/n-0.06;
    const atStart=(i%2===0), hu=atStart?bu0:bu1, s=atStart?1:-1;
    const ang=(fx ? fx*s : -fz*s)*1.45;
    const hx = fx ? fpx+fx*D : x+hu, hz = fx ? z+hu : fpz+fz*D;
    const g = hinge(utag+i, hx, 0, hz, 'y', ang);
    const cu = hu + s*(bu1-bu0)/2;
    const leaf = fx ? box(0.08,h-0.16,bu1-bu0,M.cab) : box(bu1-bu0,h-0.16,0.08,M.cab);
    toHinge(g, place(leaf, fx?fpx+fx*(D-0.005):x+cu, y0+h/2,
                           fx?z+cu:fpz+fz*(D-0.005)));
    const k=new THREE.Mesh(new THREE.SphereGeometry(F(0.05),10,10),M.brass);
    setDoorHandle(g, toHinge(g, fx ? place(k, fpx+fx*(D+0.05), y0+0.46, z+u)
                  : place(k, x+u, y0+0.46, fpz+fz*(D+0.05))));
  }
}
function tallCab(x,z,w,d,h=7.2){ place(box(w,h,d,M.cab), x+w/2,h/2,z+d/2); solid(x,z,w,d); }
/* Appliance front helper. Works in a face-local frame so each appliance is
   written once and mirrors correctly:
     u = across the front (left->right), y = up, dep = into the appliance.
   faceW=false: front faces +z at z+d.   faceW=true: front faces -x at x. */
function applFace(x,z,d,faceW){
  return (u,y,uw,h,dep,mat,proud)=>{
    proud=proud||0;
    const m = faceW ? box(dep,h,uw,mat) : box(uw,h,dep,mat);
    return faceW ? place(m, x-proud+dep/2, y, z+u)
                 : place(m, x+u, y, z+d+proud-dep/2);
  };
}
/* tubular bar pull on an appliance front, with standoffs */
function applPull(x,z,d,faceW,u,y,len,vertical){
  const R=0.052, OFF=0.155, out=[];
  const bar=new THREE.Mesh(new THREE.CylinderGeometry(F(R),F(R),F(len),14),M.appl);
  if(!vertical) bar.rotation[faceW?'x':'z']=Math.PI/2;
  const px = faceW ? x-OFF : x+u,  pz = faceW ? z+u : z+d+OFF;
  out.push(place(bar, px, y, pz));
  for(const s of [-1,1]){
    const so=new THREE.Mesh(new THREE.CylinderGeometry(F(0.032),F(0.032),F(OFF),10),M.appl);
    so.rotation[faceW?'z':'x']=Math.PI/2;
    const du = vertical?0:s*(len/2-0.14), dy = vertical?s*(len/2-0.14):0;
    out.push(place(so, faceW?x-OFF/2:x+u+du, y+dy, faceW?z+u+du:z+d+OFF/2));
  }
  return out;
}
/* counter-depth French-door refrigerator: dark carcass, proud door slabs with
   reveal gaps, tubular pulls, toe grille */
function fridge(x,z,w=3,d=2.4,faceW=false){
  const H=5.9, GAP=0.05, SIDE=0.04, TOE=0.30, DT=0.17;
  const AW = faceW ? d : w;                       // width across the front
  const put = applFace(x,z,d,faceW);
  // Carcass, set back by the door thickness so the doors read proud. BOTH
  // branches have to shorten the carcass along its own depth axis. The faceW
  // branch kept the full depth `w` and only shifted the centre, so its front
  // face landed exactly on the door fronts — 5.5 sq ft of coincident surface,
  // invisible on a monitor and a hard strobe in stereo.
  if(faceW) place(box(w-DT,H,d,M.applDk), x+DT+(w-DT)/2, H/2, z+d/2);
  else      place(box(w,H,d-DT,M.applDk), x+w/2, H/2, z+(d-DT)/2);
  put(AW/2, TOE*0.55, AW-2*SIDE, TOE*0.9, 0.05, M.applDk);          // toe grille
  // Everything below hangs off a hinge so it can be tapped open. Names are
  // suffixed with the footprint so Option A and Option B fridges don't share
  // open/closed state.
  const tag='@'+x.toFixed(1)+','+z.toFixed(1);
  const fh=1.66, fy=TOE+GAP+fh/2;                                    // freezer drawer
  const gF=hinge('fz'+tag, x, 0, z, 'slide', F(1.25),
                 faceW ? new THREE.Vector3(-1,0,0) : new THREE.Vector3(0,0,1));
  toHinge(gF, put(AW/2, fy, AW-2*SIDE, fh, DT, steelFace(AW,fh)));
  const dy0=TOE+GAP+fh+GAP, dh=H-dy0-SIDE, dy=dy0+dh/2;              // French doors
  const dw=(AW-2*SIDE-GAP)/2;
  const hLx = faceW ? x : x+SIDE,        hLz = faceW ? z+SIDE      : z+d;
  const hRx = faceW ? x : x+w-SIDE,      hRz = faceW ? z+d-SIDE    : z+d;
  const gL=hinge('frL'+tag, hLx, 0, hLz, 'y', -1.60);
  const gR=hinge('frR'+tag, hRx, 0, hRz, 'y',  1.60);
  toHinge(gL, put(SIDE+dw/2,    dy, dw, dh, DT, steelFace(dw,dh)));
  toHinge(gR, put(AW-SIDE-dw/2, dy, dw, dh, DT, steelFace(dw,dh)));
  // pulls: verticals flanking the centre split, horizontal on the drawer
  const pL=applPull(x,z,d,faceW, AW/2-GAP/2-0.20, dy-0.15, dh*0.62, true);
  pL.forEach(m=>toHinge(gL,m)); setDoorHandle(gL, pL[0]);
  const pR=applPull(x,z,d,faceW, AW/2+GAP/2+0.20, dy-0.15, dh*0.62, true);
  pR.forEach(m=>toHinge(gR,m)); setDoorHandle(gR, pR[0]);
  const pF=applPull(x,z,d,faceW, AW/2, fy+fh/2-0.26, AW*0.62, false);
  pF.forEach(m=>toHinge(gF,m)); setDoorHandle(gF, pF[0]);
  solid(x,z,w,d);
}

/* double wall oven. (x,z) is the left edge of the face plane; each cavity is
   hEach tall with a control strip and bar pull at the top of its door. */
/* single oven + microwave/convection tower, 30" unit. Oven door drops from the
   bottom hinge; the micro door does too (drawer-style convection). */
function ovenTower(x,z,w,alongX=true,out=1){
  const DT=0.12, tag='@'+x.toFixed(1)+','+z.toFixed(1);
  const put=(u,y,uw,h,dep,mat,off)=>{
    off=off||0;
    const m = alongX ? box(uw,h,dep,mat) : box(dep,h,uw,mat);
    return alongX ? place(m, x+u, y, z+out*(off+dep/2))
                  : place(m, x+out*(off+dep/2), y, z+u);
  };
  put(w/2, 4.05, w+0.08, 3.65, 0.05, M.applDk, -0.04);          // surround
  const doors=[{n:'ovT',y0:2.30,y1:4.25,glass:0.72},            // oven
               {n:'mwT',y0:4.33,y1:5.48,glass:0.55}];           // micro/convection
  for(const dd of doors){
    const g=hinge(dd.n+tag, x, dd.y0, z, alongX?'x':'z', alongX ? 1.45*out : -1.45*out);
    toHinge(g, put(w/2, (dd.y0+dd.y1)/2, w, dd.y1-dd.y0, DT, steelFace(w,dd.y1-dd.y0)));
    toHinge(g, put(w/2, dd.y1-0.13, w-0.16, 0.22, 0.03, M.applGl, DT-0.01));
    const gh=(dd.y1-dd.y0)*dd.glass;
    toHinge(g, put(w/2, dd.y0+0.06+gh/2, w-0.34, gh, 0.03, M.applGl, DT-0.01));
    const bar=new THREE.Mesh(new THREE.CylinderGeometry(F(0.05),F(0.05),F(w-0.22),14),M.appl);
    bar.rotation[alongX?'z':'x']=Math.PI/2;
    setDoorHandle(g, toHinge(g, alongX ? place(bar, x+w/2, dd.y1-0.38, z+out*(DT+0.13))
                      : place(bar, x+out*(DT+0.13), dd.y1-0.38, z+w/2)));
  }
  put(w/2, 5.78, w-0.2, 0.34, 0.03, M.applGl, DT-0.02);         // control panel
}
function wallOven(x,z,w,hEach,y0,alongX=true,out=1){
  const DT=0.12, GAP=0.10;
  const put=(u,y,uw,h,dep,mat,off)=>{
    off=off||0;
    const m = alongX ? box(uw,h,dep,mat) : box(dep,h,uw,mat);
    return alongX ? place(m, x+u, y, z+out*(off+dep/2))
                  : place(m, x+out*(off+dep/2), y, z+u);
  };
  put(w/2, y0+(2*hEach+GAP)/2, w+0.06, 2*hEach+GAP+0.06, 0.05, M.applDk, -0.04);
  const tag='@'+x.toFixed(1)+','+z.toFixed(1);
  for(let i=0;i<2;i++){
    const oy=y0+i*(hEach+GAP);
    // Wall ovens are bottom-hinged: the leaf drops forward about the axis that
    // runs along the face, so 'x' when the run goes along x and 'z' otherwise.
    const g=hinge('ov'+i+tag, x, oy, z, alongX?'x':'z',
                  alongX ? 1.45*out : -1.45*out);
    toHinge(g, put(w/2, oy+hEach/2, w, hEach, DT, steelFace(w,hEach)));   // door slab
    toHinge(g, put(w/2, oy+hEach-0.14, w-0.16, 0.24, 0.03, M.applGl, DT-0.01));
    const gh=hEach-0.46;
    toHinge(g, put(w/2, oy+0.07+gh/2, w-0.34, gh, 0.03, M.applGl, DT-0.01));
    const bar=new THREE.Mesh(new THREE.CylinderGeometry(F(0.05),F(0.05),F(w-0.22),14),M.appl);
    bar.rotation[alongX?'z':'x']=Math.PI/2;
    toHinge(g, alongX ? place(bar, x+w/2, oy+hEach-0.40, z+out*(DT+0.13))
                      : place(bar, x+out*(DT+0.13), oy+hEach-0.40, z+w/2));
  }
}
/* Undermount sink. (x,z,w,d) is the countertop CUTOUT — pass the same rect to
   counter(...,cut) so the top is built around it. `spout` is the direction the
   faucet points, i.e. away from the wall it stands against. */
function sink(x,z,w=2.4,d=1.5,spout='z+'){
  const TOP=CT_H, WT=0.055, DEP=0.72, REV=0.012;
  // The bowl is inset a ~1/8" reveal from the countertop cutout, the way a real
  // undermount sits under the slab. It used to line up dead flush, which put
  // the slab's cut edge and the bowl wall on the same plane on all four sides.
  const bx=x+REV, bz=z+REV, bw=w-2*REV, bd=d-2*REV;
  const cx=bx+bw/2, cz=bz+bd/2, bowl=M.basin;
  place(box(bw+2*WT,WT,bd+2*WT,bowl), cx, TOP-DEP-WT/2, cz);          // bottom
  place(box(WT,DEP,bd+2*WT,bowl), bx-WT/2,    TOP-DEP/2, cz);         // sides
  place(box(WT,DEP,bd+2*WT,bowl), bx+bw+WT/2, TOP-DEP/2, cz);
  place(box(bw,DEP,WT,bowl), cx, TOP-DEP/2, bz-WT/2);                 // ends
  place(box(bw,DEP,WT,bowl), cx, TOP-DEP/2, bz+bd+WT/2);
  const dr=new THREE.Mesh(new THREE.CylinderGeometry(F(0.17),F(0.17),F(0.035),18),M.applDk);
  place(dr, cx, TOP-DEP+0.035, cz).castShadow=false;                  // strainer
  // ---- faucet: escutcheon, column, gooseneck arc, aerator, lever ----
  const sx = spout==='x+'?1:spout==='x-'?-1:0;
  const sz = spout==='z+'?1:spout==='z-'?-1:0;
  const px = -sz, pz = sx;                                            // across the deck
  const BOFF=0.28;                                                    // behind the cutout
  const fx = sx ? (sx>0 ? x-BOFF : x+w+BOFF) : cx;
  const fz = sz ? (sz>0 ? z-BOFF : z+d+BOFF) : cz;
  const esc=new THREE.Mesh(new THREE.CylinderGeometry(F(0.17),F(0.19),F(0.06),20),M.faucet);
  place(esc, fx, TOP+0.03, fz).castShadow=false;
  const col=new THREE.Mesh(new THREE.CylinderGeometry(F(0.075),F(0.082),F(0.95),16),M.faucet);
  place(col, fx, TOP+0.475, fz).castShadow=false;
  const R=0.40, neck=TOP+0.95;
  const arc=[];
  for(let i=0;i<=18;i++){
    const a=Math.PI*i/18;
    arc.push(new THREE.Vector3(F(fx+sx*(R-R*Math.cos(a))), F(neck+R*Math.sin(a)),
                               F(fz+sz*(R-R*Math.cos(a)))));
  }
  const gn=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(arc),28,F(0.072),12,false),M.faucet);
  gn.castShadow=false; world.add(gn);
  const aer=new THREE.Mesh(new THREE.CylinderGeometry(F(0.088),F(0.078),F(0.17),14),M.faucet);
  place(aer, fx+sx*2*R, neck-0.08, fz+sz*2*R).castShadow=false;
  const lev=[new THREE.Vector3(F(fx+px*0.05),F(TOP+0.60),F(fz+pz*0.05)),
             new THREE.Vector3(F(fx+px*0.36),F(TOP+0.72),F(fz+pz*0.36))];
  const lm=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(lev),8,F(0.033),8,false),M.faucet);
  lm.castShadow=false; world.add(lm);
}
/* dishwasher front, proud of the cabinet face. (x,z) is the face plane, `out`
   the direction it faces. Callers must break the shakerRun around this bay. */
function dishwasher(x,z,w=2,alongX=true,out=1){
  const H=2.34, DT=0.13, TOE=0.24, CTL=0.19;
  const put=(u,y,uw,h,dep,mat,off)=>{
    off=off||0;
    const m = alongX ? box(uw,h,dep,mat) : box(dep,h,uw,mat);
    return alongX ? place(m, x+u, y, z+out*(off+dep/2))
                  : place(m, x+out*(off+dep/2), y, z+u);
  };
  put(w/2, (H+0.12)/2, w, H+0.12, 0.05, M.applDk, -0.03);      // reveal behind the door
  put(w/2, TOE/2, w-0.05, TOE, 0.07, M.applDk, 0);             // toe recess
  const dh=H-TOE-CTL-0.05;
  // the door is bottom-hinged like an oven; axis follows the run direction
  const g=hinge('dw'+x.toFixed(2)+','+z.toFixed(2), x, TOE, z,
                alongX?'x':'z', alongX ? 1.45*out : -1.45*out);
  toHinge(g, put(w/2, TOE+0.03+dh/2, w-0.05, dh, DT, steelFace(w,dh), 0.02));
  toHinge(g, put(w/2, H-CTL/2, w-0.05, CTL, DT*0.85, M.applGl, 0.02));  // control ledge
  const bar=new THREE.Mesh(new THREE.CylinderGeometry(F(0.045),F(0.045),F(w-0.35),14),M.appl);
  bar.rotation[alongX?'z':'x']=Math.PI/2;
  setDoorHandle(g, toHinge(g, alongX ? place(bar, x+w/2, H-CTL-0.10, z+out*(DT+0.12))
                    : place(bar, x+out*(DT+0.12), H-CTL-0.10, z+w/2)));
}
/* wrap a builder's output in a group the VR hands can pick up and slide */
function asMovable(cx, cz, fn){
  const m0 = world.children.length, s0 = solids.length;
  fn();
  const g = new THREE.Group();
  g.position.set(F(cx), 0, F(cz));
  for(const o of world.children.slice(m0)){ o.position.sub(g.position); g.add(o); }
  world.add(g);
  g.userData.mov = {sIdx: [], home: g.position.clone()};
  for(let i=s0;i<solids.length;i++) g.userData.mov.sIdx.push(i);
  movables.push(g);
  return g;
}

/* L-shaped corner sectional with the corner at the NE, so the east leg faces
   west at the fireplace and the north leg faces south at the TV. (x,z) is the
   min corner of the square footprint, L the leg length, D the seat depth. */
function sectional(x,z,L,D,fab){
  const SEAT=1.42, BACK=2.62, ARM=2.05, BT=0.58, AT=0.55, PAD=0.40;
  const x0=x, x2=x+L, x1=x2-D, z0=z, z1=z+L;
  const FF=(a,b)=>matFit(fab,a,b,3.0);
  place(box(D-0.14, SEAT-PAD, L-0.14, fab), x1+D/2, (SEAT-PAD)/2, z0+L/2);
  place(box(L-D-0.14, SEAT-PAD, D-0.14, fab), x0+(L-D)/2, (SEAT-PAD)/2, z0+D/2);
  place(box(BT, BACK, L, FF(L,BACK)), x2-BT/2, BACK/2, z0+L/2);            // east back
  place(box(L-BT, BACK, BT, FF(L-BT,BACK)), x0+(L-BT)/2, BACK/2, z0+BT/2); // north back
  place(box(D-BT, ARM, AT, fab), x1+(D-BT)/2, ARM/2, z1-AT/2);             // south arm
  place(box(AT, ARM, D-BT, fab), x0+AT/2, ARM/2, z0+BT+(D-BT)/2);          // west arm
  const sd=D-BT, cz=z0+BT+sd/2, nx0=x0+AT, nx1=x1;
  place(box(sd-0.08, PAD, sd-0.08, FF(sd,sd)), x1+sd/2, SEAT-PAD/2, cz);   // corner seat
  place(box(nx1-nx0-0.08, PAD, sd-0.08, FF(nx1-nx0,sd)), (nx0+nx1)/2, SEAT-PAD/2, cz);
  const ez0=z0+BT+sd, ez1=z1-AT, el=(ez1-ez0)/2;
  for(let i=0;i<2;i++)
    place(box(sd-0.08, PAD, el-0.08, FF(sd,el)), x1+sd/2, SEAT-PAD/2, ez0+el*(i+0.5));
  const bh=BACK-SEAT-0.14, by=SEAT+(BACK-SEAT)/2;
  place(box(0.5, bh, sd-0.1, FF(sd,bh)), x2-BT-0.25, by, cz);
  for(let i=0;i<2;i++)
    place(box(0.5, bh, el-0.1, FF(el,bh)), x2-BT-0.25, by, ez0+el*(i+0.5));
  place(box(nx1-nx0-0.1, bh, 0.5, FF(nx1-nx0,bh)), (nx0+nx1)/2, by, z0+BT+0.25);
  solid(x1, z0, D, L);
  solid(x0, z0, L-D, D);
}

function pendant(x,z,y=6.5){
  const pput=(m,a,b2,c)=>{ m.castShadow=false; return place(m,a,b2,c); };
  const mesh=(g,mat)=>new THREE.Mesh(g,mat);

    for(const yy of [y,y+H]){                     // square rims flush with posts

      pput(box(Wd+B,B,B,fm), x, yy, z+Wd/2);

      pput(box(B,B,Wd-B,fm), x+Wd/2, yy, z);

    pput(box(0.56,0.78,0.56,M.glass), x, y+H*0.5, z);

    const g=new THREE.SphereGeometry(F(0.62),22,12,0,Math.PI*2,0,Math.PI/2);
    const d=mesh(g,fm); d.rotation.x=Math.PI;    // M.lamp is DoubleSide, see finInit

    pput(mesh(new THREE.CylinderGeometry(F(0.10),F(0.10),F(0.14),12),fm), x,y+H,z);
  } else if(style==='cone'){                      // tapered metal cone
    const g=new THREE.CylinderGeometry(F(0.16),F(0.60),F(0.72),24,1,true);
    pput(mesh(g,fm),x,y+H*0.62,z);
    pput(mesh(new THREE.CylinderGeometry(F(0.09),F(0.09),F(0.16),12),fm), x,y+H,z);

    pput(mesh(new THREE.SphereGeometry(F(0.46),20,14),M.glass), x, y+H*0.5, z);

  pput(bulb,x,y+H*0.46,z);
}

function railing(x1,z1,x2,z2){ // straight rail with posts, blocks walking off
  const len = Math.hypot(x2-x1,z2-z1);
  const alongX = Math.abs(x2-x1)>Math.abs(z2-z1);
  const top = alongX ? box(len,0.16,0.16,M.rail) : box(0.16,0.16,len,M.rail);
  place(top,(x1+x2)/2,3.1,(z1+z2)/2);
  const n = Math.max(2,Math.round(len/4));
  for(let i=0;i<=n;i++){
    const t=i/n, px=x1+(x2-x1)*t, pz=z1+(z2-z1)*t;
    place(box(0.3,3.1,0.3,M.rail), px,1.55,pz);
  }
  for(let b=0;b<2;b++){
    const bar = alongX ? box(len,0.08,0.08,M.rail) : box(0.08,0.08,len,M.rail);
    place(bar,(x1+x2)/2,1.0+b*0.9,(z1+z2)/2);
  }
  if(alongX) solid(Math.min(x1,x2),z1-0.25,len,0.5);
  else solid(x1-0.25,Math.min(z1,z2),0.5,len);
}

function buildShared(opt){
  // ground + interior floor + deck platform
  const gr = new THREE.Mesh(new THREE.PlaneGeometry(F(140),F(140)), M.grass);
  gr.rotation.x=-Math.PI/2; gr.receiveShadow=true;

  fl.rotation.x=-Math.PI/2; fl.receiveShadow=true;
  fl.visible=false; world.add(fl);
  // Interior flooring only where there is interior: it used to be one big
  // rectangle that ran out under the family wall and onto the deck.
  const flr=(x0,z0,x1,z1)=>{
    const m=new THREE.Mesh(new THREE.PlaneGeometry(F(x1-x0),F(z1-z0)), M.floor);

  flr(FAM_X,DIN_S_FACE, ZONE_W, SOUTH);    // family room

  const dk = new THREE.Mesh(new THREE.PlaneGeometry(F(DECK_W+3.2),F(FAM_D)), M.deck);

  // center (~13'-6"), eaves at 10', dark faux beams following the slopes

  const th=Math.atan2(RH-EH,FAM_WV/2), slant=Math.hypot(RH-EH,FAM_WV/2);

  }
  // gables run wall-face to wall-face so the slopes have something to die into

/* ---------- movement / controls ---------- */
const pos = new THREE.Vector3();
let yaw=0, pitch=0, keys={}, locked=false, overhead=false, planMode=false;
const vel = new THREE.Vector3();

function addEvents(){
  addEventListener('resize',()=>{
    if(renderer.xr.isPresenting) return;   // the headset owns the framebuffer
    camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });
  addEventListener('keydown',e=>{keys[e.code]=true;});
  addEventListener('keyup',e=>{keys[e.code]=false;});
  const cv = renderer.domElement;
  cv.style.cursor='grab';
  let dragging=false, lastMX=0, lastMY=0;
  cv.addEventListener('mousedown',e=>{
    if(overhead||planMode||isTouch) return;
    dragging=true; lastMX=e.clientX; lastMY=e.clientY;
    cv.style.cursor='grabbing'; e.preventDefault();
  });
  addEventListener('mouseup',()=>{ dragging=false; cv.style.cursor='grab'; });
  addEventListener('mousemove',e=>{
    if(!dragging) return;
    yaw   += (e.clientX-lastMX)*0.005;
    pitch += (e.clientY-lastMY)*0.005;
    pitch = Math.max(-1.35, Math.min(1.35, pitch));
    lastMX=e.clientX; lastMY=e.clientY;
  });

  document.getElementById('btnA').onclick=()=>switchOpt('A');
  document.getElementById('btnB').onclick=()=>switchOpt('B');
  document.getElementById('btnA2').onclick=()=>switchOpt('A2');
  document.getElementById('btnFamA').onclick=()=>switchFam('A');
  document.getElementById('btnFamB').onclick=()=>switchFam('B');
  document.getElementById('btnFamB2').onclick=()=>switchFam('B2');
  document.getElementById('btnWalk').onclick=()=>setView('walk');
  document.getElementById('btnOver').onclick=()=>setView('over');
  document.getElementById('btnPlan').onclick=()=>setView('plan');
  document.getElementById('btnPdfFloor').onclick=()=>setPdfFloor(!pdfFloor);
  document.getElementById('btnXray').onclick=()=>setXray(!xray);
  document.getElementById('hudToggle').onclick=()=>{
    hudCollapsed=!hudCollapsed;
    document.getElementById('hud').classList.toggle('collapsed',hudCollapsed);
    document.getElementById('hudToggle').innerHTML=hudCollapsed?'+':'&#8211;';
    document.getElementById('hudToggle').title=hudCollapsed?'Expand':'Collapse';
    updateMapVis();
  };
  document.getElementById('btnOak').onclick=()=>setFinish('oak');
  document.getElementById('btnNavy').onclick=()=>setFinish('navy');
  document.getElementById('fov').oninput=e=>{
    camera.fov=+e.target.value; camera.updateProjectionMatrix();
    document.getElementById('fovval').textContent=e.target.value+'\u00b0';
  };

  // touch: left half = joystick, right half = look
  const stick=document.getElementById('stick'), knob=document.getElementById('knob');
  let moveId=null, lookId=null, mBase=null, lLast=null;
  const tapTrack = {};                 // identifier -> {x,y,t}, dropped once it drags
  cv.addEventListener('touchstart',e=>{
    for(const t of e.changedTouches){
      tapTrack[t.identifier] = {x:t.clientX, y:t.clientY, t:nowMs()};
      if(t.clientX<innerWidth/2 && moveId===null){
        moveId=t.identifier; mBase={x:t.clientX,y:t.clientY};
        stick.style.display='block';
        stick.style.left=(t.clientX-55)+'px'; stick.style.top=(t.clientY-55)+'px';
        touchMove={x:0,y:0};
      } else if(lookId===null){
        lookId=t.identifier; lLast={x:t.clientX,y:t.clientY};
      }
    }
    e.preventDefault();
  },{passive:false});
  cv.addEventListener('touchmove',e=>{
    for(const t of e.changedTouches){
      const tt = tapTrack[t.identifier];
      if(tt && Math.hypot(t.clientX-tt.x, t.clientY-tt.y) > 12) delete tapTrack[t.identifier];
      if(t.identifier===moveId){
        let dx=t.clientX-mBase.x, dy=t.clientY-mBase.y;
        const len=Math.hypot(dx,dy), max=48;
        if(len>max){dx*=max/len;dy*=max/len;}
        knob.style.left=(33+dx)+'px'; knob.style.top=(33+dy)+'px';
        touchMove={x:dx/max,y:dy/max};
      } else if(t.identifier===lookId){
        yaw  -=(t.clientX-lLast.x)*0.005;
        pitch-=(t.clientY-lLast.y)*0.005;
        pitch=Math.max(-1.35,Math.min(1.35,pitch));
        lLast={x:t.clientX,y:t.clientY};
      }
    }
    e.preventDefault();
  },{passive:false});
  cv.addEventListener('touchend',e=>{
    for(const t of e.changedTouches){
      const tt = tapTrack[t.identifier];
      delete tapTrack[t.identifier];
      if(tt && nowMs()-tt.t < 350) screenTap(tt.x, tt.y);   // held still and briefly
      if(t.identifier===moveId){moveId=null;touchMove={x:0,y:0};
        stick.style.display='none';knob.style.left='33px';knob.style.top='33px';}
      if(t.identifier===lookId)lookId=null;
    }
  });
}
let touchMove={x:0,y:0};
