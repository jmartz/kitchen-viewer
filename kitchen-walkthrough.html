function collide(nx,nz){
  const r=F(0.9);
  for(const b of solids){
    const cx=Math.max(b.x1,Math.min(nx,b.x2));
    const cz=Math.max(b.z1,Math.min(nz,b.z2));
    const dx=nx-cx, dz=nz-cz, d2=dx*dx+dz*dz;
    if(d2<r*r){
      const d=Math.sqrt(d2)||0.0001;
      nx=cx+dx/d*r; nz=cz+dz/d*r;
    }
  }
  // outer clamp (includes the deck to the west)
  nx=Math.max(F(DECK_X+0.6),Math.min(F(ENT_E-0.7),nx));
  nz=Math.max(F(0.8),Math.min(F(SOUTH-0.6),nz));
  return [nx,nz];
}

const clock = new THREE.Clock();
function animate(time, frame){
  const dt = Math.min(clock.getDelta(),0.05);

  if(xrOn){
    // An exception in here kills the XR frame loop outright: the headset stops
    // getting frames and the only way out is the Meta button. Never let one
    // frame's bug take the session down — log it and keep drawing, so EXIT VR
    // is still reachable.
    updateOpenables(dt);
    try{ xrFrame(dt, frame); }        // `frame` reaches hand joints + viewer pose
    catch(e){ xrTrouble(e); }
    renderer.render(scene,camera);    // camera pose comes from the headset
    return;
  }
  updateOpenables(dt);
  if(planMode){
    drawPlan();
    return;
  }
  if(!overhead){
    const run = keys['ShiftLeft']||keys['ShiftRight'] ? 2.0 : 1.0;
    const sp = 2.4*run;
    let fx=0,fz=0;
    if(keys['KeyW']||keys['ArrowUp'])fz+=1;
    if(keys['KeyS']||keys['ArrowDown'])fz-=1;
    if(keys['KeyA']||keys['ArrowLeft'])fx-=1;
    if(keys['KeyD']||keys['ArrowRight'])fx+=1;
    fz-=touchMove.y; fx+=touchMove.x;
    const l=Math.hypot(fx,fz)||1;
    const dirX=(Math.sin(yaw)* -fz + Math.cos(yaw)*fx)/l;
    const dirZ=(Math.cos(yaw)* -fz - Math.sin(yaw)*fx)/l;
    const mag=Math.min(Math.hypot(fx,fz),1);
    vel.x=dirX*sp*mag; vel.z=dirZ*sp*mag;
    let nx=pos.x+vel.x*dt, nz=pos.z+vel.z*dt;
    [nx,nz]=collide(nx,nz);
    pos.x=nx; pos.z=nz;

    camera.position.copy(pos);
    camera.rotation.set(0,0,0);
    camera.rotateY(yaw); camera.rotateX(pitch);
  } else {
    camera.position.set(F(8), F(58), F(SOUTH/2+8));
    camera.lookAt(F(8), 0, F(SOUTH/2));
  }
  drawMapDyn();
  renderer.render(scene,camera);
}

const BASE_TEX = new Set();          // textures owned by the base palette
function disposeWorld(g){
  g.traverse(o=>{
    if(o.geometry) o.geometry.dispose();
    const m = o.material;
    if(m && !Array.isArray(m) && m.userData &&
       (m.userData.baseKey || m.userData.pinned)){
      if(m.map && !BASE_TEX.has(m.map)) m.map.dispose();
      m.dispose();
    }
  });
}

/* Build something in its own axis-aligned frame, then set it into the room
   rotated by a quarter turn about (px,pz). `q` counts clockwise quarter turns in
   plan (+x east, +z south, so clockwise is a negative Y rotation). A right-angle
   rotation keeps every footprint axis-aligned, which is the whole reason this is
   safe: the collision rectangles can be rewritten exactly instead of being
   approximated by a bounding box that would be wrong for the L. */
function withYaw(q, px, pz, fn){
  const m0 = world.children.length, s0 = solids.length;
  fn();
  q = ((q % 4) + 4) % 4;
  if(!q) return;
  const th = -q*Math.PI/2;
  const g = new THREE.Group();
  g.position.set(F(px), 0, F(pz));
  g.rotation.y = th;
  for(const o of world.children.slice(m0)){ o.position.sub(g.position); g.add(o); }
  world.add(g);
  const c = Math.round(Math.cos(th)), s = Math.round(Math.sin(th));
  const PX = F(px), PZ = F(pz);
  for(let i=s0;i<solids.length;i++){
    const b = solids[i], xs = [], zs = [];
    for(const pt of [[b.x1,b.z1],[b.x2,b.z1],[b.x2,b.z2],[b.x1,b.z2]]){
      const dx = pt[0]-PX, dz = pt[1]-PZ;
      xs.push(PX + dx*c + dz*s);
      zs.push(PZ - dx*s + dz*c);
    }
    b.x1=Math.min.apply(null,xs); b.x2=Math.max.apply(null,xs);
    b.z1=Math.min.apply(null,zs); b.z2=Math.max.apply(null,zs);
  }
}

/* ============================================================
   §DOOR — things that open when you tap them
   ------------------------------------------------------------
   A door is a Group parked on its hinge line with the leaf reparented into it,
   so opening is one rotation (or one translation, for drawers). Three axes are
   needed: 'y' swings a cabinet or fridge door, 'x'/'z' drops a wall-oven door
   forward, 'slide' pulls a drawer out.

   Open state lives in DOORS, keyed by name, so it survives the world rebuild
   that an A/B or finish change triggers. `openables` is the live list and is
   rebuilt with the world.
   ============================================================ */
const DOORS = {'deck-kit':1, 'deck-famN':1};   // the two deck doors live open
let openables = [];

function hinge(name, hx, hy, hz, axis, openA, dir){
  const g = new THREE.Group();
  g.position.set(F(hx), F(hy), F(hz));
  g.userData.door = {name:name, axis:axis, open:openA, dir:dir||null,
                     t: DOORS[name] ? 1 : 0, base: g.position.clone()};
  applyDoor(g);
  world.add(g);
  openables.push(g);
  return g;
}
/* reparent a mesh that was placed in world coords onto its hinge */
function toHinge(g, mesh){
  if(!mesh) return mesh;
  mesh.position.sub(g.userData.door.base);
  g.add(mesh);
  return mesh;
}
function applyDoor(g){
  const d = g.userData.door;
  const e = d.t*d.t*(3-2*d.t);              // smoothstep: eases at both ends
  if(d.axis === 'slide') g.position.copy(d.base).addScaledVector(d.dir, d.open*e);
  else g.rotation[d.axis] = d.open*e;
}
function updateOpenables(dt){
  for(const g of openables){
    const d = g.userData.door;
    if(d.held) continue;                    // a hand owns it right now
    const want = DOORS[d.name] || 0;        // fractional: doors stay where left
    if(Math.abs(d.t - want) < 0.0015){ if(d.t !== want){ d.t = want; applyDoor(g); } continue; }
    d.t += (want - d.t) * Math.min(1, dt*4.0);
    applyDoor(g);
  }
}
/* nearest ancestor that is a door, so tapping any part of a leaf works */
function doorOf(obj){
  let o = obj;
  while(o){ if(o.userData && o.userData.door) return o; o = o.parent; }
  return null;
}
function toggleDoor(g){
  const n = g.userData.door.name;
  DOORS[n] = (DOORS[n]||0) > 0.5 ? 0 : 1;
  return !!DOORS[n];
}
function setDoorHandle(g, mesh){ g.userData.door.handle = mesh; return mesh; }
/* tap handling shared by the mouse and by a short pinch in VR */
function tapAt(){
  if(!world) return null;
  world.updateMatrixWorld(true);
  _fray.far = 60;
  const hits = _fray.intersectObject(world, true);
  for(const h of hits){
    const g = doorOf(h.object);
    if(g){ toggleDoor(g); return g; }
  }
  return null;
}

/* ---- bifold pantry doors: white solid two-panel leaves ----
   Each unit is a pair of leaves. The outer leaf swings off the jamb; the inner
   one is parented to it and counter-rotates by twice as much, which is what
   makes a bifold fold back against itself instead of swinging wide. Both leaves
   share a DOORS name so they animate as one. */
function bifoldLeaf(g, xFace, za, zb, H){
  const T = 0.13, S = 0.26, dir = Math.sign(zb - za), w = Math.abs(zb - za);
  const xc = xFace + T/2, zMid = (za + zb)/2;
  toHinge(g, place(box(T, H, S, M.door), xc, H/2, za + dir*S/2));       // stiles
  toHinge(g, place(box(T, H, S, M.door), xc, H/2, zb - dir*S/2));
  toHinge(g, place(box(T, S, w-2*S, M.door), xc, S/2, zMid));           // rails
  toHinge(g, place(box(T, S, w-2*S, M.door), xc, H-S/2, zMid));
  toHinge(g, place(box(T, S, w-2*S, M.door), xc, H*0.46, zMid));
  // the two flat panels, set back a touch so the frame reads
  const p1h = H*0.46 - S*1.5, p2h = H - H*0.46 - S*1.5;
  toHinge(g, place(box(T*0.55, p1h, w-2*S-0.04, M.door), xc+T*0.16, S + p1h/2, zMid));
  toHinge(g, place(box(T*0.55, p2h, w-2*S-0.04, M.door), xc+T*0.16, H*0.46+S*0.5+p2h/2, zMid));
  return g;
}
function bifold(name, xFace, zJamb, zEnd, H){
  const dir = Math.sign(zEnd - zJamb), half = Math.abs(zEnd - zJamb)/2;
  const A = hinge(name, xFace, 0, zJamb, 'y', -1.32*dir);
  bifoldLeaf(A, xFace, zJamb, zJamb + dir*half, H);
  const B = hinge(name, xFace, 0, zJamb + dir*half, 'y', 2.64*dir);
  bifoldLeaf(B, xFace, zJamb + dir*half, zEnd, H);
  const k = new THREE.Mesh(new THREE.SphereGeometry(F(0.075),10,10), M.brass);
  setDoorHandle(B, toHinge(B, place(k, xFace - 0.06, H*0.44, zEnd - dir*0.28)));
  setDoorHandle(A, B.userData.door.handle);
  foldInto(A, B);
  return A;
}
/* reparent an inner leaf onto its outer leaf, keeping its hinge line put */
function foldInto(outer, inner){
  inner.position.sub(outer.userData.door.base);
  inner.userData.door.base.copy(inner.position);
  outer.add(inner);
}

/* ---- A-prime: coffee / morning station in the old shallow-pantry bay ----
   Same 3'-0" x 16" footprint, so no aisle changes. Counter at 42" with an
   appliance garage feel: tall side panels, quartz top, tile splash, two oak
   shelves, machine + kettle, outlet inside. Base doors open like everything
   else. The (E) pantry absorbs the dry goods this bay used to pretend to hold. */
function morningStation(x0, z0, w, d){
  const x1=x0+w, z1=z0+d, CTY=3.5, H=7.2;
  place(box(0.10,H,d,M.cab), x0+0.05, H/2, z0+d/2);         // side panels
  place(box(0.10,H,d,M.cab), x1-0.05, H/2, z0+d/2);
  place(box(w-0.20,H,0.10,M.cab), x0+w/2, H/2, z0+0.05);    // back
  place(box(w,0.15,d,M.cab), x0+w/2, H-0.075, z0+d/2);      // top
  place(box(w-0.20,CTY-0.18,d-0.25,M.cab), x0+w/2,(CTY-0.18)/2, z0+(d-0.25)/2); // base
  place(box(w,0.13,d-0.05,matFit(M.top,w,d,6)), x0+w/2, CTY-0.065, z0+(d-0.05)/2);
  place(box(w-0.20,1.15,0.07,matFit(M.tile,w,1.15,2)), x0+w/2, CTY+0.575, z0+0.14)
    .castShadow=false;                                       // splash
  for(const sy of [4.95, 5.95])
    place(box(w-0.24,0.09,1.05,matFit(M.wood,w,1.05,1.4)), x0+w/2, sy, z0+0.55);
  // espresso machine + kettle on the counter
  place(box(0.80,0.95,0.85,M.applDk), x0+0.65, CTY+0.475, z0+0.62);
  place(box(0.70,0.10,0.75,M.steel),  x0+0.65, CTY+0.05+0.95, z0+0.62); // top plate
  place(box(0.09,0.28,0.30,M.steel),  x0+0.65, CTY+0.31, z0+1.12);      // group + tray
  const kb=new THREE.Mesh(new THREE.CylinderGeometry(F(0.26),F(0.30),F(0.62),14),M.steel);
  place(kb, x1-0.75, CTY+0.31, z0+0.60).castShadow=false;               // kettle
  const kh=new THREE.Mesh(new THREE.CylinderGeometry(F(0.05),F(0.05),F(0.34),8),M.black);
  kh.rotation.z=Math.PI/2; place(kh, x1-0.42, CTY+0.44, z0+0.60).castShadow=false;
  outlet(x0+w/2+0.65, z0+0.16, CTY+0.6, true);               // inside the garage
  // two base doors, hinged like every other cabinet
  const tag='morn'+x0.toFixed(1);
  bayDoor(tag+'L', x0, z1-0.08, true, 1, 0.0, 0.14, true,  w/2-0.20, 0.30, CTY-0.22,
          M.cab, x0+w/2-0.30, 1.9, z1+0.05);
  bayDoor(tag+'R', x0, z1-0.08, true, 1, 0.0, w-0.14, false, w/2-0.20, 0.30, CTY-0.22,
          M.cab, x0+w/2+0.30, 1.9, z1+0.05);
  solid(x0, z0, w, d);
}

/* ---- family room layouts ----
   Interior Define "James" 4-seat corner sectional, 104" x 104" x 40" deep, Azure.
   A: as drawn, slid east so its back is against the east wall, facing the 85"
      on the south wall.
   B: turned a quarter clockwise into the south-east corner, so the two backs
      land on the south and east walls and the corner opens north-west at the
      fireplace, with a 65" over the hearth instead. */
function famRug(cx, cz, w, d){
  const r = new THREE.Mesh(new THREE.PlaneGeometry(F(w),F(d)), M.rug);
  r.rotation.x = -Math.PI/2;
  place(r, cx, 0.02, cz);
}
function buildFamily(){
  const EAST = ZONE_W, SOUTHI = SOUTH - WALL_T/2;   // interior wall faces
  const L = 8.667, D = 3.333;
  if(famOpt === 'B' || famOpt === 'B2'){
    // The footprint is square, so rotating about its own centre leaves the
    // square exactly where it is and only swings the L round inside it.
    const x0 = EAST - L, z0 = SOUTHI - L;
    withYaw(1, x0 + L/2, z0 + L/2, ()=> sectional(x0, z0, L, D, M.sofa));
    // The firebox opening tops out at y=4.40, so a 65" centred at 4.50 cut
    // straight through it. Bottom of the screen now clears it by ~6".
    tv(6.64, 23.97, 6.30, 65, false, 1);            // 65" on the chimney face
    famRug(12.2, 26.6, 7, 8);
    if(famOpt === 'B2'){
      // B-prime: 48" round pedestal table for four, kept to the family-room
      // side so the run from the kitchen/dining passage to the NW deck doors
      // stays clear. Verified with the walkability pathfinder.
      const tx=14.5, tz=19.6, TR=2.0;
      const tt=new THREE.Mesh(new THREE.CylinderGeometry(F(TR),F(TR),F(0.15),36),
                              matFit(M.wood,TR*2,TR*2,1.6));
      place(tt, tx, 2.5, tz);
      place(new THREE.Mesh(new THREE.CylinderGeometry(F(0.22),F(0.30),F(2.35),16),M.woodDk),
            tx, 1.25, tz);
      place(new THREE.Mesh(new THREE.CylinderGeometry(F(1.05),F(1.05),F(0.12),24),M.woodDk),
            tx, 0.08, tz);
      solid(tx-TR+0.3, tz-TR+0.3, 2*(TR-0.3), 2*(TR-0.3));
      chair(tx-2.35, tz, 1);        chair(tx+2.35, tz, -1);
      chair(tx, tz-2.35, 1, -1);    chair(tx, tz+2.35, 1, 1);
    }
  } else {
    sectional(EAST - L, 22.0, L, D, M.sofa);
    tv(13.7, SOUTH-WALL_T/2, 3.75, 85, true, -1);   // 85" on the south wall
    famRug(10.4, 23.4, 6, 9);
  }
}

/* ---- (E) PANTRY: reach-in off the family room, louvered pair ----
   Footprint line-scanned off the sheet, see PAN_* constants. */
function pantry(){
  const x0=PAN_X0, x1=PAN_X1, z0=PAN_Z0, z1=PAN_Z1, H=PAN_H;
  const w = z1 - z0, d = x1 - x0;
  place(box(0.12, H, w, M.cab), x1-0.06, H/2, (z0+z1)/2);            // back
  place(box(d, H, 0.12, M.cab), (x0+x1)/2, H/2, z0+0.06);            // side walls -
  place(box(d, H, 0.12, M.cab), (x0+x1)/2, H/2, z1-0.06);            // without these
  place(box(d, 0.14, w, M.cab), (x0+x1)/2, H-0.07, (z0+z1)/2);       // you see daylight
  for(const sy of [1.35, 2.55, 3.75, 4.95, 6.05])                    // shelves
    place(box(d-0.16, 0.11, w-0.20, M.cab), (x0+x1)/2 + 0.06, sy, (z0+z1)/2);
  solid(x0, z0, d, w);
  const half = w/2;
  bifold('pantry-N', x0, z0, z0+half, H);
  bifold('pantry-S', x0, z1, z1-half, H);
}

/* ============================================================
   §FIN — finish editor: point at something, recolour every one of them
   ------------------------------------------------------------
   Every mesh draws from the shared `M` palette, so "change all the cabinets" is
   really just M.cab.color. Three things make it less trivial than that:

   1. matFit()/steelFace() hand out a per-mesh clone whenever a surface needs
      world-scale texture repeat. Those carry userData.baseKey so a global
      change can find them; miss it and about a third of the kitchen quietly
      ignores you, countertops worst of all.

   2. Several palette entries exist purely to CONTRAST with their neighbour:
      applDk is the dark reveal between stainless doors, trimDk is the shaker
      rail against the door face, pillow is the light cushion on the bench.
      Painting those the same colour as their partner erases the detail — the
      fridge becomes one flat slab and the shaker doors go blank. They are
      `accent` entries now and take a derived shade of the picked colour.

   3. A finish is not just a colour. Metals have almost no diffuse response, so
      a matte-black paint value on a metalness-0.9 faucet renders as a near
      black mirror rather than matte black. Metal swatches carry metalness and
      roughness alongside the colour, so picking "matte black" actually makes
      the material matte.
   ============================================================ */
const TEX = {};                 // procedural canvases, filled by makeMaterials()
const FIN = {};                 // kind -> {c,m,r}; plus .styles and .inst
let finRev = 0;                 // bumped on every change; the VR panel keys off it
let _MKEY = null;
function mkey(mat){             // material object -> palette key
  if(!_MKEY){ _MKEY = new Map(); for(const k in M) _MKEY.set(M[k], k); }
  return _MKEY.get(mat);
}

const TOP_STYLES = {
  quartz:  {label:'White quartz',  color:0xf7f5f0, tex:'vein',    rep:6,   r:0.26, cc:0.55},
  marble:  {label:'Veined marble', color:0xe4e2df, tex:'vein',    rep:3.2, r:0.18, cc:0.70},
  soap:    {label:'Soapstone',     color:0x3f464b, tex:'plaster', rep:4,   r:0.50, cc:0.15},
  butcher: {label:'Butcher block', color:0xc0904f, tex:'grain',   rep:2.2, r:0.62, cc:0.10},
  concrete:{label:'Concrete',      color:0x9d9a94, tex:'plaster', rep:5,   r:0.78, cc:0.04}
};
const LAMP_STYLES = {
  lantern:{label:'Lantern'}, dome:{label:'Dome'}, cone:{label:'Cone'}, globe:{label:'Globe'}
};

/* paint rows: colour only, the material keeps its own metalness/roughness */
const SW = {
  neutral:[0xf5f2ec,0xe8e2d6,0xd6cfc2,0xb4a894,0x9a9080,0x6f6a60,0x4a4741,0x2b2926],
  warm:   [0xe6d2ae,0xd9c4a3,0xc79a63,0xa8875a,0x8a6a44,0x6f5638],
  cool:   [0xa9b8c4,0x8494a3,0x5c7185,0x34455a,0x22303c],
  green:  [0xb3bda6,0x9aa88f,0x6f8069,0x4a5c47,0x33402f]
};
const P_PAINT = ['neutral','cool','green','warm'];
const P_WOOD  = ['warm','neutral','green'];

/* metal presets carry the PBR response, not just the hue */
const MET = (c,m,r,n) => ({c:c, m:m, r:r, n:n});
const SW_METAL = [
  MET(0xc9ccd1,0.85,0.30,'Stainless'),  MET(0xf0f2f4,0.85,0.16,'Chrome'),
  MET(0x9aa1a9,0.85,0.42,'Nickel'),     MET(0x6e737a,0.80,0.55,'Pewter'),
  MET(0xb08d46,0.90,0.30,'Brass'),      MET(0xd9c98f,0.90,0.20,'Polished brass'),
  MET(0x8a6a36,0.85,0.45,'Bronze'),     MET(0x2c2e33,0.45,0.50,'Matte black')
];
/* appliances can also be painted, which means dropping the metalness right down */
const SW_APPL = SW_METAL.concat([
  MET(0xf3f1ec,0.10,0.45,'White'),      MET(0x26262a,0.12,0.50,'Black'),
  MET(0x3b5c46,0.12,0.50,'Green'),      MET(0x34455a,0.12,0.50,'Navy')
]);

const KINDS = {
  cab:     {label:'Cabinets',        mats:['cab'],   accent:[['trimDk',0.90]], rows:P_PAINT},
  island:  {label:'Island',          mats:['cabIslOak','cabIslNavy'],          rows:P_PAINT},
  top:     {label:'Countertops',     mats:['top'], styles:TOP_STYLES,          rows:['neutral']},
  tile:    {label:'Backsplash',      mats:['tile'],                            rows:P_PAINT},
  wall:    {label:'Walls',           mats:['wall'], perInstance:true,          rows:P_PAINT},
  appl:    {label:'Appliances',      mats:['appl'], accent:[['applDk',0.42]],  metal:SW_APPL},
  hw:      {label:'Cab. hardware',   mats:['brass'],                           metal:SW_METAL},
  faucet:  {label:'Faucet',          mats:['faucet'],                          metal:SW_METAL},
  sink:    {label:'Sink bowl',       mats:['basin'],                           metal:SW_METAL},
  lamp:    {label:'Pendants',        mats:['lamp'], styles:LAMP_STYLES,        metal:SW_METAL},
  cushion: {label:'Bench cushions',  mats:['cushion','cushB'], accent:[['pillow',1.22]], rows:P_PAINT},
  sofa:    {label:'Sofa',            mats:['sofa'],                            rows:P_PAINT},
  rug:     {label:'Rug',             mats:['rug'],                             rows:P_PAINT},
  seat:    {label:'Stools & chairs', mats:['wood'], accent:[['woodDk',0.74]],  rows:P_WOOD},
  trim:    {label:'Trim & doors',    mats:['trimW','door'],                    rows:['neutral','cool']},
  frame:   {label:'Window frames',   mats:['frame'],                           metal:SW_METAL},
  stone:   {label:'Fireplace',       mats:['stone'],                           rows:['neutral','warm']},
  deck:    {label:'Deck & railing',  mats:['deck'], accent:[['rail',0.86]],    rows:P_WOOD}
};
/* accents resolve to their parent kind too, so pointing at a dark fridge reveal
   or a shaker rail selects the thing you meant */
const MAT2KIND = {};
for(const k in KINDS){
  (KINDS[k].mats||[]).forEach(m=>{ if(!MAT2KIND[m]) MAT2KIND[m]=k; });
  (KINDS[k].accent||[]).forEach(a=>{ if(!MAT2KIND[a[0]]) MAT2KIND[a[0]]=k; });
}
const KIND_LIST = Object.keys(KINDS);

let DEFAULTS = null;            // captured once, after convertPBR
function finInit(){
  M.lamp.side = THREE.DoubleSide;          // open dome / cone shades read as solid
  M.lamp.color.copy(M.frame.color);        // matches the old finish-linked default
  for(const k in M){ const m=M[k]; if(m && m.map) BASE_TEX.add(m.map); }
  DEFAULTS = {};
  for(const k in M){
    const m = M[k]; if(!m || !m.color) continue;
    DEFAULTS[k] = {c:m.color.clone(), m:m.metalness, r:m.roughness};
  }
  readURL();
}

/* ---- colour ---- */
function asSw(v){ return (typeof v === 'number') ? {c:v} : v; }
function shade(hex, f){
  const c = new THREE.Color(hex);
  return new THREE.Color(Math.min(1,c.r*f), Math.min(1,c.g*f), Math.min(1,c.b*f)).getHex();
}
/* write colour (+ optional PBR response) to a set of palette keys and their clones */
function applyToMats(keys, hex, sw){
  const lin = new THREE.Color(hex).convertSRGBToLinear();
  const put = m => {
    if(m.color) m.color.copy(lin);
    if(sw.m !== undefined && 'metalness' in m) m.metalness = sw.m;
    if(sw.r !== undefined && 'roughness' in m) m.roughness = sw.r;
    m.needsUpdate = true;
  };
  for(const k of keys){ const m = M[k]; if(m) put(m); }
  eachClone(keys, mm=>{ if(!mm.userData.pinned) put(mm); });
}
function setKindColor(kind, v, quiet){
  const K = KINDS[kind]; if(!K || !K.mats) return;
  finRev++;
  const sw = asSw(v);
  FIN[kind] = sw;
  applyToMats(K.mats, sw.c, sw);
  if(K.accent) for(const a of K.accent) applyToMats([a[0]], shade(sw.c, a[1]), sw);
  if(!quiet) syncURL();
}
/* every per-mesh clone whose base is one of `mats` */
function eachClone(mats, fn){
  if(!world) return;
  const seen = new Set();
  world.traverse(o=>{
    const mm = o.material; if(!mm || Array.isArray(mm) || seen.has(mm)) return;
    seen.add(mm);
    const bk = mm.userData && mm.userData.baseKey;
    if(bk && mats.indexOf(bk) >= 0) fn(mm, o);
  });
}

/* ---- per-instance override (walls) ---- */
function pidOf(mesh){
  if(mesh.userData._pid) return mesh.userData._pid;
  const p = mesh.position, g = (mesh.geometry && mesh.geometry.parameters) || {};
  const r = v => Math.round((v||0)*1000);
  const id = [matKeyOf(mesh), r(p.x),r(p.y),r(p.z), r(g.width),r(g.height),r(g.depth)].join(',');
  return (mesh.userData._pid = id);
}
function matKeyOf(mesh){
  const mm = mesh.material; if(!mm || Array.isArray(mm)) return null;
  return (mm.userData && mm.userData.baseKey) || mkey(mm) || null;
}
function kindOfMesh(mesh){
  const k = matKeyOf(mesh);
  return k ? (MAT2KIND[k] || null) : null;
}
function setInstanceColor(mesh, v){
  const baseKey = matKeyOf(mesh); if(!baseKey) return;
  finRev++;
  const sw = asSw(v);
  let mm = mesh.material;
  if(!(mm.userData && mm.userData.pinned)){
    mm = mm.clone();
    mm.userData = {baseKey: baseKey, pinned: true};
    mesh.material = mm;
  }
  mm.color.copy(new THREE.Color(sw.c).convertSRGBToLinear());
  if(sw.m !== undefined && 'metalness' in mm) mm.metalness = sw.m;
  if(sw.r !== undefined && 'roughness' in mm) mm.roughness = sw.r;
  FIN.inst = FIN.inst || {};
  FIN.inst[pidOf(mesh)] = sw;
  syncURL();
}

/* ---- styles (need a rebuild) ---- */
function setKindStyle(kind, name){
  finRev++;
  FIN.styles = FIN.styles || {};
  FIN.styles[kind] = name;
  if(kind === 'lamp') FIN.lampStyle = name;      // pendant() reads this at build
  applyStyles();
  syncURL();
  buildOption(current);
}
function applyStyles(){
  const s = (FIN.styles && FIN.styles.top) || 'quartz';
  const t = TOP_STYLES[s] || TOP_STYLES.quartz;
  const m = M.top;
  if(!FIN.top) m.color.copy(new THREE.Color(t.color).convertSRGBToLinear());
  const cv = TEX[t.tex];
  if(cv){
    if(m.map && !BASE_TEX.has(m.map)) m.map.dispose();
    const tx = new THREE.CanvasTexture(cv);
    tx.wrapS = tx.wrapT = THREE.RepeatWrapping;
    tx.encoding = THREE.sRGBEncoding;
    tx.repeat.set(t.rep, t.rep);
    m.map = tx;
    if(m.bumpMap) m.bumpMap = tx;
  }
  if('roughness' in m) m.roughness = t.r;
  if('clearcoat' in m) m.clearcoat = t.cc;
  m.needsUpdate = true;
  FIN.lampStyle = (FIN.styles && FIN.styles.lamp) || 'lantern';
}

/* re-apply the whole scheme; called after every buildOption() */
function applyFinishes(){
  for(const kind in FIN){
    if(KINDS[kind] && KINDS[kind].mats) setKindColor(kind, FIN[kind], true);
  }
  if(FIN.inst && world){
    world.traverse(o=>{
      if(!o.isMesh || !o.material || Array.isArray(o.material)) return;
      const sw = FIN.inst[pidOf(o)];
      if(sw === undefined) return;
      const baseKey = matKeyOf(o);
      const mm = o.material.clone();
      mm.userData = {baseKey: baseKey, pinned: true};
      mm.color.copy(new THREE.Color(sw.c).convertSRGBToLinear());
      if(sw.m !== undefined && 'metalness' in mm) mm.metalness = sw.m;
      if(sw.r !== undefined && 'roughness' in mm) mm.roughness = sw.r;
      o.material = mm;
    });
  }
  if(selKind) setHighlight(selKind, true);
}
function resetFinishes(){
  finRev++;
  for(const k in FIN) delete FIN[k];
  if(DEFAULTS) for(const k in DEFAULTS){
    const m = M[k], d = DEFAULTS[k]; if(!m) continue;
    m.color.copy(d.c);
    if(d.m !== undefined && 'metalness' in m) m.metalness = d.m;
    if(d.r !== undefined && 'roughness' in m) m.roughness = d.r;
    m.needsUpdate = true;
  }
  applyStyles();
  syncURL();
  buildOption(current);
}

/* ---- URL hash, so a scheme can be texted to someone ----
   key-RRGGBB, or key-RRGGBB,metal,rough with the two PBR terms as hundredths */
let _urlLock = false;
function encSw(sw){
  const h = sw.c.toString(16).padStart(6,'0');
  return (sw.m === undefined) ? h
       : h + ',' + Math.round(sw.m*100) + ',' + Math.round(sw.r*100);
}
function decSw(s){
  const p = s.split(',');
  const sw = {c: parseInt(p[0],16)};
  if(p.length === 3){ sw.m = (+p[1])/100; sw.r = (+p[2])/100; }
  return sw;
}
function syncURL(){
  if(_urlLock) return;
  const parts = [];
  for(const k of KIND_LIST) if(FIN[k]) parts.push(k+'-'+encSw(FIN[k]));
  if(current !== 'A') parts.push('kit-'+current);
  if(famOpt !== 'A') parts.push('fam-'+famOpt);
  if(FIN.styles) for(const k in FIN.styles) parts.push('s.'+k+'-'+FIN.styles[k]);
  if(FIN.inst) for(const id in FIN.inst) parts.push('i.'+encodeURIComponent(id)+'-'+encSw(FIN.inst[id]));
  const h = parts.length ? '#f='+parts.join('~') : '';
  try{ history.replaceState(null,'',location.pathname+location.search+h); }catch(e){}
}
function readURL(){
  const m = /[#&]f=([^&]+)/.exec(location.hash); if(!m){ applyStyles(); return; }
  _urlLock = true;
  for(const tok of decodeURIComponent(m[1]).split('~')){
    const i = tok.lastIndexOf('-'); if(i < 0) continue;
    const key = tok.slice(0,i), val = tok.slice(i+1);
    if(key.startsWith('s.')){ FIN.styles = FIN.styles||{}; FIN.styles[key.slice(2)] = val; }
    else if(key.startsWith('i.')){ FIN.inst = FIN.inst||{}; FIN.inst[decodeURIComponent(key.slice(2))] = decSw(val); }
    else if(key === 'kit'){ if(OPTS[val]) current = val; }
    else if(key === 'fam'){ if(val==='A'||val==='B'||val==='B2') famOpt = val; }
    else if(KINDS[key]) FIN[key] = decSw(val);
  }
  _urlLock = false;
  applyStyles();
}

/* ---- selection + highlight ---- */
let selKind = null, selMesh = null, pickMode = false, wallScope = 'all';
const _fray = new THREE.Raycaster();
const HL = new THREE.Color(0x3a2a08), NOHL = new THREE.Color(0x000000);

function setHighlight(kind, on){
  const K = KINDS[kind]; if(!K || !K.mats) return;
  const keys = K.mats.concat((K.accent||[]).map(a=>a[0]));
  const c = on ? HL : NOHL;
  for(const k of keys){ const m=M[k]; if(m && m.emissive){ m.emissive.copy(c); m.needsUpdate=true; } }
  eachClone(keys, mm=>{ if(mm.emissive) mm.emissive.copy(c); });
}
function clearHighlight(){ for(const kind of KIND_LIST) setHighlight(kind, false); }
function selectKind(kind, mesh){
  if(selKind && selKind !== kind) setHighlight(selKind, false);
  selKind = kind; selMesh = mesh || null;
  if(kind) setHighlight(kind, true);
  onSelectionChanged();
}
/* First hit that has an adjustable finish. `_fray` must already be aimed.
   Raycasting happens outside the render loop (event handlers, XR frames), and
   three only refreshes world matrices during render — without the forced
   update every object tests at the origin and picking returns nonsense. */
function pickHits(){
  if(!world) return null;
  world.updateMatrixWorld(true);
  _fray.far = 60;
  const hits = _fray.intersectObject(world, true);
  for(const h of hits){
    if(!h.object.isMesh) continue;
    const k = kindOfMesh(h.object);
    if(k) return {mesh:h.object, kind:k, point:h.point};
  }
  return null;
}
function pickRay(origin, dir){
  if(!world) return null;
  _fray.set(origin, dir);
  return pickHits();
}
/* apply the current swatch, honouring the wall "this one / all" scope */
function applyPick(sw){
  if(!selKind) return;
  if(KINDS[selKind].perInstance && wallScope === 'one' && selMesh) setInstanceColor(selMesh, sw);
  else setKindColor(selKind, sw);
  onSelectionChanged();
}
function swatchesFor(kind){
  const K = KINDS[kind]; if(!K) return [];
  if(K.metal) return K.metal;
  const out = [];
  for(const r of (K.rows||['neutral'])) for(const c of SW[r]) out.push({c:c});
  return out;
}

/* ---- desktop UI for the finish editor ---- */
function setPickMode(v){
  pickMode = v;
  const el = document.getElementById('fin');
  if(el) el.style.display = v ? 'block' : 'none';
  const b = document.getElementById('btnFinish');
  if(b) b.classList.toggle('on', v);
  if(!v){ clearHighlight(); selKind = null; selMesh = null; }
  onSelectionChanged();
}
/* redraws both surfaces: the DOM panel and, by bumping its key, the VR one */
function onSelectionChanged(){
  panelKey = '';
  const el = id => document.getElementById(id);
  const kindEl = el('finKind'); if(!kindEl) return;
  const K = selKind ? KINDS[selKind] : null;
  kindEl.textContent = K ? K.label : '';
  el('finHint').style.display = K ? 'none' : 'block';
  el('finScope').style.display = (K && K.perInstance) ? 'flex' : 'none';
  el('finRow').style.display = K ? 'flex' : 'none';

  const stEl = el('finStyles');
  stEl.innerHTML = '';
  stEl.style.display = (K && K.styles) ? 'flex' : 'none';
  if(K && K.styles){
    const names = Object.keys(K.styles);
    const cur = (FIN.styles && FIN.styles[selKind]) || names[0];
    for(const s of names){
      const b = document.createElement('button');
      b.textContent = K.styles[s].label;
      if(s === cur) b.className = 'on';
      b.onclick = () => setKindStyle(selKind, s);
      stEl.appendChild(b);
    }
  }
  const swEl = el('finSw');
  swEl.innerHTML = '';
  if(K) for(const sw of swatchesFor(selKind)){
    const b = document.createElement('button');
    b.style.background = '#' + sw.c.toString(16).padStart(6,'0');
    b.title = sw.n || b.style.background;
    b.onclick = () => applyPick(sw);
    swEl.appendChild(b);
  }
  el('finAll').classList.toggle('on', wallScope === 'all');
  el('finOne').classList.toggle('on', wallScope === 'one');
}

/* One tap, whatever produced it. The canvas' touch handlers preventDefault() to
   stop the page scrolling under the joysticks, which also kills the synthesised
   mouse events — so on a phone no 'click' ever arrives and this has to be driven
   from touchend directly. */
function screenTap(cx, cy){
  if(overhead || planMode || xrOn) return;
  const cv = renderer.domElement, r = cv.getBoundingClientRect();
  _fray.setFromCamera({x:((cx-r.left)/r.width)*2-1,
                       y:-((cy-r.top)/r.height)*2+1}, camera);
  if(!pickMode){ tapAt(); return; }             // a tap opens doors
  const found = pickHits();
  if(found){ selectKind(found.kind, found.mesh); return; }
  toast('Nothing adjustable there — try a cabinet, wall or worktop.', 2600);
}

function finDesktopEvents(){
  const cv = renderer.domElement;
  let downX=0, downY=0, moved=0;
  cv.addEventListener('mousedown', e=>{ downX=e.clientX; downY=e.clientY; moved=0; });
  cv.addEventListener('mousemove', e=>{
    moved = Math.max(moved, Math.abs(e.clientX-downX)+Math.abs(e.clientY-downY));
  });
  cv.addEventListener('click', e=>{
    if(moved > 5) return;                       // that was a drag-look, not a click
    screenTap(e.clientX, e.clientY);
  });
  // one-handed browsing: drag to look, wheel to walk. Forward is where you face.
  cv.addEventListener('wheel', e=>{
    if(overhead || planMode || xrOn) return;
    e.preventDefault();
    // substepped through collide(), or a hard flick tunnels straight through
    // a counter (one notch of deltaY 300 is a 0.84 m leap)
    let d = -e.deltaY * 0.0012;
    const step = 0.09 * Math.sign(d);
    while(Math.abs(d) > 1e-4){
      const s = Math.abs(d) > 0.09 ? step : d;
      const [nx,nz] = collide(pos.x - Math.sin(yaw)*s, pos.z - Math.cos(yaw)*s);
      pos.x = nx; pos.z = nz;
      d -= s;
    }
  }, {passive:false});

  const on = (id, fn) => { const b = document.getElementById(id); if(b) b.onclick = fn; };
  on('btnFinish', ()=>setPickMode(!pickMode));
  on('finAll',    ()=>{ wallScope='all'; onSelectionChanged(); });
  on('finOne',    ()=>{ wallScope='one'; onSelectionChanged(); });
  on('finReset',  ()=>{ resetFinishes(); selectKind(null); });
  on('finCopy',   ()=>{
    const url = location.href;
    const ok = ()=>toast('Link copied — it carries every finish choice.', 3500);
    if(navigator.clipboard && window.isSecureContext)
      navigator.clipboard.writeText(url).then(ok, ()=>toast(url, 8000));
    else toast(url, 8000);
  });
  const pick = document.getElementById('finPick');
  if(pick) pick.oninput = e => applyPick({c: parseInt(e.target.value.slice(1),16)});
}

/* ============================================================
   §XR — Quest / WebXR immersive mode
   ------------------------------------------------------------
   The headset owns `camera` while a session runs, so the player is moved by
   translating a parent `rig` instead. `camera` is a child of `rig`; outside XR
   the rig stays at identity, so all the existing desktop camera code still
   works unchanged.

   Reference space is local-floor: y=0 is the real floor, which is also the
   model floor, so the user's true standing height is their eye height in the
   kitchen — the whole point of taking this to VR.

   Head pose is read from the XRFrame's viewer pose, NOT from `camera`. three
   only writes camera.position during render(), so anything reading it before
   the first render() gets the stale desktop position — which is what used to
   fling the spawn out onto the deck.

   Works with hand tracking AND Touch controllers. Everything essential is
   driven by `select` (controller trigger / hand pinch) plus a poke panel that
   rides on the left wrist, so a guest who has never held a controller can run
   the whole demo bare-handed.

     select (trigger or pinch, either hand)  aim the arc, release to teleport
     poke the wrist panel                    swap A/B · plan floor · EXIT VR
     controllers also: left stick glide, right stick snap turn, grip runs,
                       A swap, B finish, X recenter, Y exit
   ============================================================ */
let rig=null, xrOn=false, xrCtrls=[], needRecenter=false, foveated=false;
const XR_TURN = Math.PI/6, XR_SPEED = 1.5, DEAD = 0.22;
const _v = new THREE.Vector3(), _q = new THREE.Quaternion(),
      _v2 = new THREE.Vector3(), _q2 = new THREE.Quaternion(),
      _m  = new THREE.Matrix4(),  _s  = new THREE.Vector3();

/* Where VR drops you: family room, just north of the sectional, facing the
   kitchen. The shell only builds wall stubs at x 0..3 and 6.0..6.6 along
   z=ZONE_D, so from here the opening through to the island and the north run
   is wide open. yaw 0 == facing north. */
const XR_SPAWN = {x:13.5, z:19.5, yaw:0};
const ENT_E=40.90, ENT_NZ=2.02, STAIR_X=37.71;  // entry, line-scanned

/* ---- head pose, in rig-local (reference) space, straight from the frame ---- */
const headPos = new THREE.Vector3(), headQuat = new THREE.Quaternion();
let headOK = false;
function readHead(frame){
  const ref = renderer.xr.getReferenceSpace();
  const vp  = (frame && ref) ? frame.getViewerPose(ref) : null;
  if(!vp){ return (headOK = false); }
  const p = vp.transform.position, o = vp.transform.orientation;
  headPos.set(p.x, p.y, p.z);
  headQuat.set(o.x, o.y, o.z, o.w);
  return (headOK = true);
}
function headWorld(out){ return out.copy(headPos).applyMatrix4(rig.matrixWorld); }
function headWorldQuat(out){ return out.copy(rig.quaternion).multiply(headQuat); }

/* ---- hand joints ---- */
const HAND_JOINTS = ['wrist','thumb-metacarpal','thumb-phalanx-proximal',
  'thumb-phalanx-distal','thumb-tip'].concat(
  ['index','middle','ring','pinky'].reduce((a,f)=>a.concat(
    ['metacarpal','phalanx-proximal','phalanx-intermediate','phalanx-distal','tip']
      .map(s=>f+'-finger-'+s)), []));
const J_TIP = HAND_JOINTS.indexOf('index-finger-tip'), J_WRIST = 0;

function setupXR(){
  renderer.xr.setReferenceSpaceType('local-floor');
  rig = new THREE.Group();
  rig.add(camera);
  scene.add(rig);

  for(let i=0;i<2;i++){
    const c = renderer.xr.getController(i);
    c.userData.prev = {};
    c.addEventListener('connected', e=>{
      c.userData.hand   = e.data.handedness;
      c.userData.src    = e.data;
      c.userData.gp     = e.data.gamepad || null;
      c.userData.isHand = !!e.data.hand;
      // a tracked hand draws its own joints; a controller gets a small stub
      if(!c.userData.isHand && !c.userData.stub){
        const b = new THREE.Mesh(new THREE.BoxGeometry(0.035,0.03,0.09),
          new THREE.MeshBasicMaterial({color:0x2a2c31}));
        b.position.z = 0.02;
        c.add(b); c.userData.stub = b;
      }
    });
    c.addEventListener('disconnected', ()=>{
      c.userData.gp = null; c.userData.src = null; c.userData.isHand = false;
      if(c.userData.stub){ c.remove(c.userData.stub); c.userData.stub = null; }
      if(c.userData.hmesh) c.userData.hmesh.visible = false;
      if(aimCtrl === c) cancelAim();
    });
    // a controller trigger and a hand pinch both raise select
    c.addEventListener('selectstart', ()=>{ onSelectStart(c); });
    c.addEventListener('selectend',   ()=>{ onSelectEnd(c); });
    rig.add(c);
    xrCtrls.push(c);
  }

  renderer.xr.addEventListener('sessionstart', ()=>{
    xrOn = true;
    document.body.classList.add('xr');
    setView('walk');
    setXray(false);                       // transparent everything is unreadable in VR
    document.getElementById('btnVR').textContent = 'Exit VR';
    // Quest 2 budget: one shadow cascade at half res, mild fixed foveation.
    if(sunLight){
      sunLight.shadow.mapSize.set(1024,1024);
      if(sunLight.shadow.map){ sunLight.shadow.map.dispose(); sunLight.shadow.map = null; }
    }
    // Depth precision scales with the near plane, and stereo makes every
    // near-coincident surface strobe. 5 cm is a desktop habit; 10 cm is the VR
    // norm and buys back a full bit of depth buffer everywhere.
    camera.near = 0.10; camera.updateProjectionMatrix();
    needRecenter = true; foveated = false; headOK = false;
    panelReady = false; holdCtrl = null; aimDirS = null;
    if(panel) panel.userData.placed = false;
  });

  renderer.xr.addEventListener('sessionend', ()=>{
    xrOn = false;
    document.body.classList.remove('xr');
    document.getElementById('btnVR').textContent = 'Enter VR';
    if(headOK){
      headWorld(_v); pos.x=_v.x; pos.z=_v.z; pos.y=F(5.6);
      headWorldQuat(_q);
      _v.set(0,0,-1).applyQuaternion(_q);
      yaw = Math.atan2(-_v.x, -_v.z); pitch = 0;
    }
    cancelAim();
    endDoorGrab(); endMovGrab();
    if(avatar) avatar.visible = false;
    iconPool.forEach(s=>s.visible=false);
    if(panel) panel.visible = false;
    xrCtrls.forEach(c=>{ if(c.userData.hmesh) c.userData.hmesh.visible = false; });
    rig.position.set(0,0,0); rig.rotation.set(0,0,0);
    camera.near = 0.05; camera.updateProjectionMatrix();
    if(sunLight){
      sunLight.shadow.mapSize.set(2048,2048);
      if(sunLight.shadow.map){ sunLight.shadow.map.dispose(); sunLight.shadow.map = null; }
    }
  });

  initVRButton();
}

/* ---- hand rendering: one InstancedMesh of 25 joint spheres per hand ----
   WebXR does not draw hands for you. Without this you are invisible to
   yourself and nothing reads as touchable. */
function handMesh(c){
  if(c.userData.hmesh) return c.userData.hmesh;
  const im = new THREE.InstancedMesh(
    new THREE.SphereGeometry(1,8,6),
    new THREE.MeshStandardMaterial({color:0xe6d5bb, roughness:0.9, metalness:0}),
    HAND_JOINTS.length);
  im.frustumCulled = false; im.castShadow = false; im.receiveShadow = false;
  im.visible = false;
  rig.add(im);
  return (c.userData.hmesh = im);
}
/* returns rig-local {tip, wrist} for a tracked hand, else null */
function updateHand(c, frame){
  const src = c.userData.src, ref = renderer.xr.getReferenceSpace();
  if(!src || !src.hand || !src.hand.get || !frame || !ref){
    if(c.userData.hmesh) c.userData.hmesh.visible = false;
    return null;
  }
  const im = handMesh(c);
  if(!c.userData.tipV){ c.userData.tipV=new THREE.Vector3(); c.userData.wristV=new THREE.Vector3(); }
  let any=false, tip=null, wrist=null;
  for(let i=0;i<HAND_JOINTS.length;i++){
    const j  = src.hand.get(HAND_JOINTS[i]);
    const jp = j ? frame.getJointPose(j, ref) : null;
    if(!jp){ _m.makeScale(0,0,0); im.setMatrixAt(i,_m); continue; }
    any = true;
    const p = jp.transform.position, o = jp.transform.orientation;
    _v2.set(p.x,p.y,p.z); _q2.set(o.x,o.y,o.z,o.w);
    _m.compose(_v2, _q2, _s.setScalar(Math.max(jp.radius||0.008, 0.006)));
    im.setMatrixAt(i,_m);
    if(i===J_TIP)   tip   = c.userData.tipV.copy(_v2);
    if(i===J_WRIST) wrist = c.userData.wristV.copy(_v2);
  }
  im.instanceMatrix.needsUpdate = true;
  im.visible = any;
  return any ? {tip, wrist} : null;
}

/* ---- teleport arc ---- */
let arcLine=null, arcRing=null, aimCtrl=null, aimValid=false;
const aimPt = new THREE.Vector3();
const ARC_N=28, ARC_DT=0.055, ARC_V=7.0, ARC_G=9.8;
function ensureArc(){
  if(arcLine) return;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(ARC_N*3),3));
  arcLine = new THREE.Line(g, new THREE.LineBasicMaterial({color:0xc8a24a}));
  arcLine.frustumCulled = false; arcLine.visible = false;
  scene.add(arcLine);
  const rg = new THREE.RingGeometry(0.14,0.24,28); rg.rotateX(-Math.PI/2);
  arcRing = new THREE.Mesh(rg, new THREE.MeshBasicMaterial(
    {color:0xc8a24a, transparent:true, opacity:0.85, side:THREE.DoubleSide}));
  arcRing.visible = false;
  scene.add(arcRing);
}
function cancelAim(){
  aimCtrl = null; aimValid = false;
  if(arcLine){ arcLine.visible = false; arcRing.visible = false; }
}
let aimDirS = null;
function updateAim(){
  ensureArc();
  aimCtrl.getWorldPosition(_v);
  aimCtrl.getWorldQuaternion(_q);
  // low-pass the aim direction; raw hand tracking makes the landing ring dance
  const raw = new THREE.Vector3(0,0,-1).applyQuaternion(_q).normalize();
  if(!aimDirS) aimDirS = raw.clone(); else aimDirS.lerp(raw, 0.22).normalize();
  const vx = _v2.copy(aimDirS).multiplyScalar(ARC_V);
  const arr = arcLine.geometry.attributes.position.array;
  let hit=false, hx=0, hz=0, prevX=_v.x, prevY=_v.y, prevZ=_v.z;
  arr[0]=prevX; arr[1]=prevY; arr[2]=prevZ;
  for(let i=1;i<ARC_N;i++){
    let x,y,z;
    if(hit){ x=hx; y=0; z=hz; }
    else{
      const t = i*ARC_DT;
      x = _v.x + vx.x*t;
      y = _v.y + vx.y*t - 0.5*ARC_G*t*t;
      z = _v.z + vx.z*t;
      if(y <= 0){
        const f = (prevY - y) !== 0 ? prevY/(prevY-y) : 0;
        hx = prevX + (x-prevX)*f;
        hz = prevZ + (z-prevZ)*f;
        x=hx; y=0; z=hz; hit=true;
      } else { prevX=x; prevY=y; prevZ=z; }
    }
    arr[i*3]=x; arr[i*3+1]=y; arr[i*3+2]=z;
  }
  arcLine.geometry.attributes.position.needsUpdate = true;
  arcLine.visible = true;
  if(hit){
    // land where you'd actually be allowed to stand; only refuse when the
    // correction is big enough that the marker would lie about the outcome
    const c = collide(hx,hz);
    aimValid = Math.hypot(c[0]-hx, c[1]-hz) < 1.0;
    aimPt.set(c[0],0,c[1]);
    arcRing.position.set(c[0],0.02,c[1]);
    arcRing.visible = true;
  } else {
    aimValid = false; arcRing.visible = false;
  }
  const col = aimValid ? 0xc8a24a : 0xd0483a;
  arcLine.material.color.setHex(col);
  arcRing.material.color.setHex(col);
}
function commitTeleport(){
  if(aimValid && headOK){
    rig.updateMatrixWorld(true);
    headWorld(_v);
    rig.position.x += aimPt.x - _v.x;
    rig.position.z += aimPt.z - _v.z;
    rig.updateMatrixWorld(true);
    pos.set(aimPt.x, F(5.6), aimPt.z);
  }
  cancelAim();
}

/* ---- wrist panel: status, controls, and the in-VR finish editor ----
   Pressed by pushing the other hand's index fingertip (or a controller) into
   it, so it needs no button knowledge at all. Billboards to the head so it is
   always readable, and draws on top so hands can't hide it.

   Two pages. 'main' is the demo controls; 'edit' is the finish picker, which
   also flips `pickMode` so a pinch out in the room selects a surface instead
   of teleporting. Hit regions come from the same item list that was last
   drawn, so what you poke is always what you see. */
let panel=null, panelTex=null, panelKey='', panelHot=-1, pokeArmed=true;
let panelPage='main', panelCache=[];
const PANEL_W=0.30, PANEL_H=0.20, PC_W=420, PC_H=280;

function panelItems(){
  const items=[];
  const BW=(PC_W-16-3*8)/4, BY=PC_H-58, BH=50;
  const bar=(i,label,sub,act,hot)=>items.push({x:8+i*(BW+8),y:BY,w:BW,h:BH,label,sub,act,hot});
  const endVR=()=>{ const s=renderer.xr.getSession(); if(s) s.end(); };
  if(panelPage==='main'){
    const BW5=(PC_W-16-4*6)/5, BY5=PC_H-58;
    const bar5=(i,label,sub2,act,hot)=>items.push(
      {x:8+i*(BW5+6), y:BY5, w:BW5, h:50, label:label, sub:sub2, act:act, hot:hot});
    const kd = current==='A2' ? 'A\u2032' : current;
    bar5(0,'KIT '+kd,'cycle kitchen', ()=>switchOpt(current==='A'?'A2':current==='A2'?'B':'A'));
    bar5(1,'FAM '+(famOpt==='B2'?'B\u2032':famOpt),'cycle family', ()=>switchFam(famOpt==='A'?'B':famOpt==='B'?'B2':'A'));
    bar5(2,'PLAN','sheet floor',  ()=>setPdfFloor(!pdfFloor), pdfFloor);
    bar5(3,'FINISH','recolour',   ()=>{ panelPage='edit'; pickMode=true; }, false);
    bar5(4,'EXIT','end session',  endVR);
    return items;
  }
  const K = selKind ? KINDS[selKind] : null;
  if(K && K.styles){
    const names=Object.keys(K.styles), w=(PC_W-16-(names.length-1)*6)/names.length;
    const cur=(FIN.styles&&FIN.styles[selKind])||names[0];
    names.forEach((s,i)=>items.push({x:8+i*(w+6), y:72, w:w, h:30, small:true,
      label:K.styles[s].label, hot:cur===s, act:()=>setKindStyle(selKind,s)}));
  }
  if(K && K.perInstance){
    const w=(PC_W-16-6)/2;
    items.push({x:8,       y:108, w:w, h:28, small:true, label:'ALL WALLS',
      hot:wallScope==='all', act:()=>{ wallScope='all'; }});
    items.push({x:8+w+6,   y:108, w:w, h:28, small:true, label:'THIS WALL',
      hot:wallScope==='one', act:()=>{ wallScope='one'; }});
  }
  if(K){
    const sw=swatchesFor(selKind), COLS=8, cw=(PC_W-16-(COLS-1)*4)/COLS, ch=22;
    sw.slice(0,COLS*3).forEach((c,i)=>{
      const r=Math.floor(i/COLS), q=i%COLS;
      items.push({x:8+q*(cw+4), y:144+r*(ch+4), w:cw, h:ch, swatch:c.c, act:()=>applyPick(c)});
    });
  }
  bar(0,'BACK','done', ()=>{ panelPage='main'; pickMode=false; clearHighlight();
                             selKind=null; selMesh=null; cancelAim(); });
  bar(1,'RESET','defaults', ()=>resetFinishes());
  bar(2,'A / B','swap option', ()=>switchOpt(current==='A'?'B':'A'));
  bar(3,'EXIT VR','end session', endVR);
  return items;
}

function ensurePanel(){
  if(panel) return panel;
  const cv=document.createElement('canvas'); cv.width=PC_W; cv.height=PC_H;
  panelTex=new THREE.CanvasTexture(cv);
  panelTex.encoding=THREE.sRGBEncoding;
  panel=new THREE.Mesh(new THREE.PlaneGeometry(PANEL_W,PANEL_H),
    new THREE.MeshBasicMaterial({map:panelTex, transparent:true, depthTest:false}));
  panel.renderOrder=999;
  panel.visible=false;
  rig.add(panel);
  drawPanel();
  return panel;
}
function drawPanel(){
  if(!panelTex) return;
  const key=[panelPage,current,famOpt,finish,pdfFloor,selKind,wallScope,panelHot,finRev,xrErr].join('|');
  if(key===panelKey) return;            // a canvas upload every frame is not free
  panelKey=key;
  panelCache=panelItems();
  const g=panelTex.image.getContext('2d');
  g.clearRect(0,0,PC_W,PC_H);
  g.fillStyle='rgba(20,19,17,.93)'; g.fillRect(0,0,PC_W,PC_H);
  g.strokeStyle='#c8a24a'; g.lineWidth=3; g.strokeRect(1.5,1.5,PC_W-3,PC_H-3);

  if(panelPage==='main'){
    g.fillStyle='#c8a24a'; g.font='bold 38px system-ui, sans-serif';
    g.fillText('KITCHEN '+(current==='A2'?'A\u2032':current), 14, 46);
    g.fillStyle='rgba(245,242,236,.62)'; g.font='20px system-ui, sans-serif';
    g.fillText('family '+famOpt+'  \u00b7  '+(finish==='oak'?'oak':'navy')+' island', 14, 76);
    g.fillStyle='rgba(245,242,236,.5)'; g.font='17px system-ui, sans-serif';
    g.fillText('pinch / trigger to aim, release to go', 14, 112);
    g.fillText('FINISH lets you recolour what you point at', 14, 138);
  } else {
    g.fillStyle='#c8a24a'; g.font='bold 26px system-ui, sans-serif';
    g.fillText(selKind ? KINDS[selKind].label : 'Point and pinch', 14, 38);
    g.fillStyle='rgba(245,242,236,.55)'; g.font='16px system-ui, sans-serif';
    g.fillText(selKind ? 'every one of them changes together'
                       : 'aim at a surface in the room, then pinch', 14, 60);
  }

  if(xrErr){                            // something threw in the frame loop
    g.fillStyle='#d0483a'; g.fillRect(8,PC_H-84,PC_W-16,22);
    g.fillStyle='#fff'; g.font='13px system-ui, sans-serif';
    g.fillText(('glitch: '+xrErr).slice(0,54), 14, PC_H-68);
  }
  for(const it of panelCache){
    const hot = (panelHot>=0 && panelCache[panelHot]===it);
    if(it.swatch !== undefined){
      g.fillStyle='#'+it.swatch.toString(16).padStart(6,'0');
      g.fillRect(it.x,it.y,it.w,it.h);
      g.strokeStyle = hot ? '#ffffff' : 'rgba(0,0,0,.45)';
      g.lineWidth = hot ? 3 : 1;
      g.strokeRect(it.x,it.y,it.w,it.h);
      continue;
    }
    const on = hot || it.hot;
    g.fillStyle = on ? '#c8a24a' : 'rgba(245,242,236,.09)';
    g.fillRect(it.x,it.y,it.w,it.h);
    g.strokeStyle = on ? '#c8a24a' : 'rgba(200,162,74,.55)';
    g.lineWidth=2; g.strokeRect(it.x,it.y,it.w,it.h);
    g.textAlign='center';
    g.fillStyle = on ? '#1c1a17' : '#c8a24a';
    if(it.small){
      g.font='bold 15px system-ui, sans-serif';
      g.fillText(it.label, it.x+it.w/2, it.y+it.h/2+5);
    } else {
      g.font='bold 20px system-ui, sans-serif';
      g.fillText(it.label, it.x+it.w/2, it.y+26);
      g.fillStyle = on ? 'rgba(28,26,23,.75)' : 'rgba(245,242,236,.55)';
      g.font='13px system-ui, sans-serif';
      g.fillText(it.sub||'', it.x+it.w/2, it.y+44);
    }
    g.textAlign='left';
  }
  panelTex.needsUpdate=true;
}
/* which item is rig-local point `p` touching? -1 on the panel but on no item,
   null if not on the panel at all */
function panelPick(p){
  if(!panel || !panel.visible) return null;
  _m.copy(panel.matrix).invert();
  _s.copy(p).applyMatrix4(_m);
  if(Math.abs(_s.z) > 0.035) return null;
  const u=(_s.x/PANEL_W+0.5)*PC_W, v=(0.5-_s.y/PANEL_H)*PC_H;
  if(u<0||u>PC_W||v<0||v>PC_H) return null;
  for(let i=0;i<panelCache.length;i++){
    const r=panelCache[i];
    if(u>=r.x && u<=r.x+r.w && v>=r.y && v<=r.y+r.h) return i;
  }
  return -1;
}
/* suppress a teleport/pick when the select was really someone using the menu.
   Controller objects are children of rig, so .position is already rig-local. */
function nearPanel(c){
  if(!panel || !panel.visible) return false;
  return panelPick(c.position) !== null;
}
/* ray out of a controller or hand, in world space */
function vrPickFrom(c){
  c.getWorldPosition(_v); c.getWorldQuaternion(_q);
  return pickRay(_v.clone(), _v2.set(0,0,-1).applyQuaternion(_q).normalize().clone());
}
/* straight pointer while the finish editor is open */
function updatePickRay(c){
  ensureArc();
  c.getWorldPosition(_v); c.getWorldQuaternion(_q);
  const d=_v2.set(0,0,-1).applyQuaternion(_q).normalize();
  const hit=pickRay(_v.clone(), d.clone());
  const end = hit ? hit.point : _v.clone().add(d.clone().multiplyScalar(6));
  const arr=arcLine.geometry.attributes.position.array;
  for(let i=0;i<ARC_N;i++){
    const t=i/(ARC_N-1);
    arr[i*3]  =_v.x+(end.x-_v.x)*t;
    arr[i*3+1]=_v.y+(end.y-_v.y)*t;
    arr[i*3+2]=_v.z+(end.z-_v.z)*t;
  }
  arcLine.geometry.attributes.position.needsUpdate=true;
  arcLine.visible=true;
  arcLine.material.color.setHex(hit?0xc8a24a:0x6d6a63);
  if(hit){
    arcRing.position.copy(hit.point);
    arcRing.visible=true;
    arcRing.material.color.setHex(0xc8a24a);
  } else arcRing.visible=false;
}

/* put the head exactly at (x,z) metres, facing `ya` */
function recenterTo(x, z, ya){
  rig.position.set(0,0,0);
  rig.rotation.set(0, ya||0, 0);
  rig.updateMatrixWorld(true);
  headWorld(_v);
  rig.position.set(x - _v.x, 0, z - _v.z);
  rig.updateMatrixWorld(true);
  pos.set(x, F(5.6), z);
}
/* snap turn about the head, not the rig origin, or the room swings around you */
function snapTurn(a){
  rig.updateMatrixWorld(true);
  headWorld(_v);
  const hx=_v.x, hz=_v.z;
  rig.rotation.y += a;
  rig.updateMatrixWorld(true);
  headWorld(_v);
  rig.position.x += hx - _v.x;
  rig.position.z += hz - _v.z;
  rig.updateMatrixWorld(true);
}

/* Fixed foveated rendering. three r128 has no renderer.xr.setFoveation (added
   r131), and the base layer doesn't exist until the session's render state has
   been applied — so reach for it on the first frame, not on sessionstart. */
function applyFoveation(level){
  if(typeof renderer.xr.setFoveation === 'function'){ renderer.xr.setFoveation(level); return true; }
  const s = renderer.xr.getSession();
  const layer = s && s.renderState && s.renderState.baseLayer;
  if(layer && 'fixedFoveation' in layer){ layer.fixedFoveation = level; return true; }
  return false;
}

/* Surfaces a frame-loop error where the user can actually see it: the wrist
   panel, since an immersive session has no console and no browser chrome.
   Rate-limited, because a broken frame repeats 72 times a second. */
let xrErr=null, xrErrN=0;
function xrTrouble(e){
  xrErrN++;
  if(xrErr !== String(e && e.message)){
    xrErr = String(e && e.message);
    panelKey = '';                       // force the panel to redraw with the notice
    if(window.console) console.error('[xr frame]', e);
  }
}
function xrFrame(dt, frame){
  if(!foveated) foveated = applyFoveation(0.7);
  if(!readHead(frame)) return;            // no pose yet: do nothing at all
  rig.updateMatrixWorld(true);

  if(needRecenter){
    recenterTo(F(XR_SPAWN.x), F(XR_SPAWN.z), XR_SPAWN.yaw);
    needRecenter = false;
    return;
  }

  /* ---- read every input, hand or controller ---- */
  let mx=0, mz=0, run=1;
  const pokeTips = [];
  const dz = v => Math.abs(v) < DEAD ? 0 : (v - Math.sign(v)*DEAD)/(1-DEAD);

  for(const c of xrCtrls){
    const joints = updateHand(c, frame);
    if(joints){
      if(joints.tip) pokeTips.push({c, p:joints.tip});
    } else if(c.userData.src){
      pokeTips.push({c, p:c.position.clone()});
    }

    const gp = c.userData.gp;
    if(!gp) continue;
    const ax = gp.axes || [];
    const sx = dz(ax.length >= 4 ? (ax[2]||0) : (ax[0]||0));
    const sy = dz(ax.length >= 4 ? (ax[3]||0) : (ax[1]||0));
    const b  = gp.buttons || [];
    const down = i => !!(b[i] && b[i].pressed);
    const hit  = i => { const d=down(i), was=c.userData.prev[i]; c.userData.prev[i]=d; return d && !was; };

    if(down(1)) run = 2.0;                       // grip runs; the trigger aims

    if(c.userData.hand === 'right'){
      if(Math.abs(sx) > 0.65){
        if(!c.userData.turned){ snapTurn(-Math.sign(sx)*XR_TURN); c.userData.turned = true; }
      } else if(Math.abs(sx) < 0.3) c.userData.turned = false;
      if(hit(4)) switchOpt(current === 'A' ? 'B' : 'A');
      if(hit(5)) setFinish(finish === 'oak' ? 'navy' : 'oak');
    } else {
      mx += sx; mz += sy;
      if(hit(4)) needRecenter = true;
      if(hit(5)){ const s = renderer.xr.getSession(); if(s){ s.end(); return; } }
    }
  }

  ensurePanel();
  panel.visible = true;
  placePanel(dt);

  /* ---- poke to press, point to highlight ---- */
  let pokeNow = -1;
  for(const t of pokeTips){
    const i = panelPick(t.p);
    if(i !== null && i >= 0){ pokeNow = i; break; }
  }
  if(pokeNow >= 0 && pokeArmed){
    const it = panelCache[pokeNow];
    if(it && it.act) it.act();
    pokeArmed = false;
  }
  if(pokeNow < 0) pokeArmed = true;
  const pc = pointerCtrl();
  let hoverNow = -1;
  if(pokeNow < 0 && pc){
    const i = panelRayPick(pc);
    if(i !== null && i >= 0) hoverNow = i;
  }
  panelHot = pokeNow >= 0 ? pokeNow : hoverNow;
  drawPanel();

  /* ---- pointer / teleport arc ---- */
  updateHandleIcons();
  updateDoorGrab();
  updateMovGrab();
  updateAvatar(dt);
  if(pickMode){
    if(pc) updatePickRay(pc); else cancelAim();
  } else if(holdCtrl){
    const held = (nowMs() - (holdCtrl.userData.tDown||0))/1000;
    if(held >= TELE_HOLD){ aimCtrl = holdCtrl; updateAim(); }
    else drawHoldRay(holdCtrl, held/TELE_HOLD);
  } else if(aimCtrl) updateAim();

  /* ---- smooth locomotion (controller sticks; hands teleport instead) ---- */
  const mag = Math.min(Math.hypot(mx,mz), 1);
  headWorld(_v);
  let nx=_v.x, nz=_v.z;
  if(mag > 0){
    headWorldQuat(_q);
    const d = _v2.set(mx,0,mz).applyQuaternion(_q);
    d.y = 0;
    if(d.lengthSq() > 1e-6){
      d.normalize();
      const step = XR_SPEED * run * mag * dt;
      nx += d.x*step; nz += d.z*step;
    }
  }
  // physical walking still needs to be kept out of the cabinets
  const c2 = collide(nx,nz);
  rig.position.x += c2[0] - _v.x;
  rig.position.z += c2[1] - _v.z;
  rig.updateMatrixWorld(true);
  pos.set(c2[0], F(5.6), c2[1]);
}

/* The panel used to ride the left wrist. In practice it jittered with tracking
   noise, jumped across the room the moment the left hand left the cameras' view,
   and its left-hand column was effectively unreachable - you had to push your
   right hand through your own forearm to get at it. It is body-locked now: a
   lectern floating below eye line that follows the head lazily, so it holds
   still while you look around and never ends up behind your arm. */
let panelYaw = 0, panelReady = false;
const PANEL_DIST = 0.55, PANEL_DROP = 0.36, PANEL_SLACK = 0.55, PANEL_ASIDE = 0.72;
function placePanel(dt){
  const f = _v2.set(0,0,-1).applyQuaternion(headQuat); f.y = 0;
  const hy = (f.lengthSq() > 1e-6) ? Math.atan2(f.x, f.z) : panelYaw;
  if(!panelReady){ panelYaw = hy; panelReady = true; }
  let d = hy - panelYaw;
  while(d >  Math.PI) d -= 2*Math.PI;
  while(d < -Math.PI) d += 2*Math.PI;
  // dead zone, then ease: it only re-aims once you have really turned away
  if(Math.abs(d) > PANEL_SLACK)
    panelYaw += Math.sign(d) * (Math.abs(d) - PANEL_SLACK) * Math.min(1, dt*2.5);
  // parked off to the LEFT of where you look, not dead ahead
  const py = panelYaw + PANEL_ASIDE;
  const tx = headPos.x + Math.sin(py)*PANEL_DIST;
  const tz = headPos.z + Math.cos(py)*PANEL_DIST;
  const ty = headPos.y - PANEL_DROP;
  if(!panel.userData.placed){ panel.position.set(tx,ty,tz); panel.userData.placed = true; }
  else panel.position.lerp(_v2.set(tx,ty,tz), Math.min(1, dt*7));
  panel.lookAt(headWorld(_v));
  panel.updateMatrix();
}
/* ---- handle affordance + grab-to-open ----
   Near a handle (within a foot) a small ring lights up on it; pinch inside the
   grab radius and it brightens and the door follows your hand — swing, slide or
   drop mapped per hinge axis. Let go and the door stays exactly where you left
   it (DOORS holds fractions now); the ring dims, and fades once you move away. */
const NEAR_R = 0.3048, GRAB_R = 0.22;
let iconDim=null, iconLit=null, iconPool=[], grabDoor=null, grabCtrl=null, grabRef={};
let grabMov=null, movOff=new THREE.Vector3();
function iconTex(fill){
  const c=document.createElement('canvas'); c.width=c.height=64;
  const g=c.getContext('2d');
  g.strokeStyle='#c8a24a'; g.lineWidth=7;
  if(fill){ g.fillStyle='rgba(200,162,74,0.95)'; g.beginPath(); g.arc(32,32,22,0,7); g.fill(); }
  else { g.fillStyle='rgba(20,19,17,0.55)'; g.beginPath(); g.arc(32,32,22,0,7); g.fill(); }
  g.beginPath(); g.arc(32,32,22,0,7); g.stroke();
  const tx=new THREE.CanvasTexture(c); tx.encoding=THREE.sRGBEncoding; return tx;
}
function ensureIcons(){
  if(iconPool.length) return;
  iconDim=iconTex(false); iconLit=iconTex(true);
  for(let i=0;i<5;i++){
    const s=new THREE.Sprite(new THREE.SpriteMaterial({map:iconDim, transparent:true, depthTest:false}));
    s.scale.set(0.075,0.075,1); s.renderOrder=998; s.visible=false;
    scene.add(s); iconPool.push(s);
  }
}
const _hw=new THREE.Vector3(), _tw=new THREE.Vector3(), _tw2=new THREE.Vector3();
function handTips(){
  const tips=[];
  for(const c of xrCtrls){
    if(!c.userData.src) continue;
    if(c.userData.isHand && c.userData.tipV)
      tips.push({c, p:_tw.copy(c.userData.tipV).applyMatrix4(rig.matrixWorld).clone()});
    else tips.push({c, p:c.getWorldPosition(new THREE.Vector3())});
  }
  return tips;
}
function updateHandleIcons(){
  ensureIcons();
  const tips=handTips();
  headWorld(_hw);
  const near=[];
  for(const g of openables){
    const h=g.userData.door.handle; if(!h) continue;
    h.getWorldPosition(_tw2);
    if(_tw2.distanceToSquared(_hw) > 4.4) continue;      // > ~2.1 m from head
    let dmin=1e9;
    for(const t of tips) dmin=Math.min(dmin, _tw2.distanceTo(t.p));
    if(dmin < NEAR_R || grabDoor===g)
      near.push({g, pos:_tw2.clone(), lit: grabDoor===g, d:dmin});
  }
  near.sort((a,b)=>a.d-b.d);
  for(let i=0;i<iconPool.length;i++){
    const s=iconPool[i], n=near[i];
    if(!n){ s.visible=false; continue; }
    s.position.copy(n.pos); s.position.y += 0.055;
    s.material.map = n.lit ? iconLit : iconDim;
    s.material.opacity = n.lit ? 1.0 : 0.85;
    s.visible=true;
  }
}
function nearestHandle(p){
  let best=null, bd=GRAB_R;
  for(const g of openables){
    const h=g.userData.door.handle; if(!h) continue;
    h.getWorldPosition(_tw2);
    const d=_tw2.distanceTo(p);
    if(d<bd){ bd=d; best=g; }
  }
  return best;
}
function nearestMovable(p){
  let best=null, bd=0.38;
  for(const g of movables){
    _tw2.copy(g.position); _tw2.y=p.y;
    const d=_tw2.distanceTo(p);
    if(d<bd){ bd=d; best=g; }
  }
  return best;
}
function grabPoint(c){
  if(c.userData.isHand && c.userData.tipV)
    return _tw.copy(c.userData.tipV).applyMatrix4(rig.matrixWorld);
  return c.getWorldPosition(_tw);
}
function startDoorGrab(c, g){
  grabDoor=g; grabCtrl=c;
  const d=g.userData.door;
  d.held=true;
  const p=grabPoint(c);
  grabRef={t0:d.t, y0:p.y, p0:p.clone()};
  if(d.axis==='y'){
    grabRef.a0=Math.atan2(p.x-g.position.x, p.z-g.position.z);
  }
}
function updateDoorGrab(){
  if(!grabDoor) return;
  const d=grabDoor.userData.door, p=grabPoint(grabCtrl);
  let tt=d.t;
  if(d.axis==='y'){
    let da=Math.atan2(p.x-grabDoor.position.x, p.z-grabDoor.position.z)-grabRef.a0;
    while(da>Math.PI) da-=2*Math.PI;
    while(da<-Math.PI) da+=2*Math.PI;
    tt=grabRef.t0 + da/d.open;
  } else if(d.axis==='slide'){
    tt=grabRef.t0 + _tw2.copy(p).sub(grabRef.p0).dot(d.dir)/Math.abs(d.open);
  } else {
    tt=grabRef.t0 + (grabRef.y0-p.y)/0.5;
  }
  d.t=Math.max(0,Math.min(1,tt));
  DOORS[d.name]=d.t;
  applyDoor(grabDoor);
}
function endDoorGrab(){
  if(!grabDoor) return;
  grabDoor.userData.door.held=false;
  DOORS[grabDoor.userData.door.name]=grabDoor.userData.door.t;
  grabDoor=null; grabCtrl=null;
}
function startMovGrab(c, g){
  grabMov=g; grabCtrl=c;
  movOff.copy(g.position).sub(grabPoint(c)); movOff.y=0;
}
function updateMovGrab(){
  if(!grabMov) return;
  const p=grabPoint(grabCtrl);
  const nx=p.x+movOff.x, nz=p.z+movOff.z;
  const dx=nx-grabMov.position.x, dz=nz-grabMov.position.z;
  grabMov.position.x=nx; grabMov.position.z=nz;
  for(const i of grabMov.userData.mov.sIdx){
    const b=solids[i]; if(!b) continue;
    b.x1+=dx; b.x2+=dx; b.z1+=dz; b.z2+=dz;
  }
}
function endMovGrab(){ grabMov=null; grabCtrl=null; }

/* ---- body avatar: a 200 lb frame under the headset so you can look down
   and judge an aisle. Height comes from the real head height every frame. */
let avatar=null, avYaw=0;
function ensureAvatar(){
  if(avatar) return avatar;
  avatar=new THREE.Group();
  const am=new THREE.MeshLambertMaterial({color:0x39404a, transparent:true, opacity:0.6});
  const mk=(w,h,d)=>{ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), am);
    m.castShadow=m.receiveShadow=false; avatar.add(m); return m; };
  avatar.userData.torso=mk(0.48,1,0.27);       // shoulders 19", chest 10.5"
  avatar.userData.hips=mk(0.43,0.22,0.27);
  avatar.userData.legL=mk(0.17,1,0.19);
  avatar.userData.legR=mk(0.17,1,0.19);
  rig.add(avatar);
  return avatar;
}
function updateAvatar(dt){
  ensureAvatar();
  avatar.visible=true;
  const H=Math.max(1.1, headPos.y);
  const hipY=0.50*H, shY=H-0.22;
  const f=_tw2.set(0,0,-1).applyQuaternion(headQuat); f.y=0;
  if(f.lengthSq()>1e-4){
    const hy=Math.atan2(f.x,f.z);
    let da=hy-avYaw;
    while(da>Math.PI) da-=2*Math.PI;
    while(da<-Math.PI) da+=2*Math.PI;
    avYaw+=da*Math.min(1,dt*5);
  }
  avatar.position.set(headPos.x - Math.sin(avYaw)*0.06, 0, headPos.z - Math.cos(avYaw)*0.06);
  avatar.rotation.y=avYaw;
  const u=avatar.userData;
  u.torso.scale.y=shY-hipY; u.torso.position.y=(shY+hipY)/2;
  u.hips.position.y=hipY;
  const legH=hipY-0.11;
  u.legL.scale.y=legH; u.legL.position.set(-0.115, legH/2, 0);
  u.legR.scale.y=legH; u.legR.position.set( 0.115, legH/2, 0);
}

/* the one hand that points and teleports - right if we have it */
function pointerCtrl(){
  const live = xrCtrls.filter(c=>c.userData.src);
  return live.filter(c=>c.userData.hand === 'right')[0] || live[0] || null;
}
/* ray-vs-panel, returns the item index under the pointer */
const _pv = new THREE.Vector3();
function panelRayPick(c){
  if(!panel || !panel.visible) return null;
  c.getWorldPosition(_v); c.getWorldQuaternion(_q);
  _fray.set(_v.clone(), _pv.set(0,0,-1).applyQuaternion(_q).normalize().clone());
  _fray.far = 4;
  const hit = _fray.intersectObject(panel, false)[0];
  if(!hit) return null;
  rig.updateMatrixWorld(true);
  _m.copy(rig.matrixWorld).invert();
  return panelPick(_pv.copy(hit.point).applyMatrix4(_m));
}
/* a straight ray that grows while you hold, so the dwell is visible rather than
   mysterious; at full length the teleport arc takes over */
function drawHoldRay(c, frac){
  ensureArc();
  c.getWorldPosition(_v); c.getWorldQuaternion(_q);
  const d = _pv.set(0,0,-1).applyQuaternion(_q).normalize();
  const len = 0.25 + 1.5*Math.min(1, frac);
  const arr = arcLine.geometry.attributes.position.array;
  for(let i=0;i<ARC_N;i++){
    const s = (i/(ARC_N-1))*len;
    arr[i*3]=_v.x+d.x*s; arr[i*3+1]=_v.y+d.y*s; arr[i*3+2]=_v.z+d.z*s;
  }
  arcLine.geometry.attributes.position.needsUpdate = true;
  arcLine.visible = true;
  arcLine.material.color.setHex(0x6d6a63);
  arcRing.visible = false;
}
/* Short press acts on what you point at; only a deliberate hold teleports, and
   only from one hand. Tapping used to fire a jump on the faintest pinch. */
const TELE_HOLD = 0.45, TELE_COOL = 350;
let holdCtrl = null, teleAt = 0;
function nowMs(){ return (typeof performance !== 'undefined') ? performance.now() : 0; }
function onSelectStart(c){
  c.userData.tDown = nowMs();
  c.userData.mode = null;
  if(nearPanel(c) || panelRayPick(c) !== null){ c.userData.mode = 'ui'; return; }
  if(pickMode){ c.userData.mode = 'finish'; return; }
  const gp2 = grabPoint(c).clone();
  const hd = nearestHandle(gp2);
  if(hd){ c.userData.mode='door'; startDoorGrab(c, hd); return; }
  const mv = nearestMovable(gp2);
  if(mv){ c.userData.mode='move'; startMovGrab(c, mv); return; }
  if(c === pointerCtrl() && nowMs() - teleAt > TELE_COOL){
    c.userData.mode = 'hold';
    holdCtrl = c;
    aimDirS = null;
  } else c.userData.mode = 'tap';
}
function onSelectEnd(c){
  const held = (nowMs() - (c.userData.tDown||0))/1000;
  const mode = c.userData.mode;
  c.userData.mode = null;
  if(holdCtrl === c) holdCtrl = null;
  if(mode === 'door'){ endDoorGrab(); return; }
  if(mode === 'move'){ endMovGrab(); return; }
  if(mode === 'ui'){
    const i = panelRayPick(c);
    const j = (i === null || i < 0) ? panelPick(c.position) : i;
    if(j !== null && j >= 0 && panelCache[j] && panelCache[j].act) panelCache[j].act();
    return;
  }
  if(mode === 'finish'){
    const h = vrPickFrom(c);
    if(h) selectKind(h.kind, h.mesh);
    return;
  }
  if(mode === 'hold' && held >= TELE_HOLD && aimCtrl === c){
    commitTeleport();
    teleAt = nowMs();
    return;
  }
  cancelAim();
  if(held < TELE_HOLD){                       // a tap: open whatever it hit
    c.getWorldPosition(_v); c.getWorldQuaternion(_q);
    _fray.set(_v.clone(), _pv.set(0,0,-1).applyQuaternion(_q).normalize().clone());
    tapAt();
  }
}

async function initVRButton(){
  const btn = document.getElementById('btnVR');
  if(!navigator.xr){
    // The usual cause is an insecure origin: WebXR needs https (or localhost),
    // so a plain http:// LAN address will silently have no navigator.xr at all.
    if(!window.isSecureContext){
      btn.className = 'unavail';
      btn.style.display = 'block';
      btn.textContent = 'VR needs an https:// address';
    }
    return;
  }
  let ok = false;
  try{ ok = await navigator.xr.isSessionSupported('immersive-vr'); }catch(e){}
  if(!ok) return;
  btn.style.display = 'block';
  btn.onclick = async ()=>{
    const live = renderer.xr.getSession();
    if(live){ live.end(); return; }
    try{
      const s = await navigator.xr.requestSession('immersive-vr',
        {optionalFeatures:['local-floor','bounded-floor','hand-tracking']});
      await renderer.xr.setSession(s);
    }catch(e){ toast('Could not start VR: ' + e.message, 6000); }
  };
}

const planView={z:1,x:null,y:null};
function initPlanControls(){
  const pc=document.getElementById('plan');
  pc.style.cursor='grab';
  pc.addEventListener('wheel',e=>{
    e.preventDefault();
    const f=Math.exp(-e.deltaY*0.0012);
    const nz=Math.max(0.5,Math.min(14,planView.z*f)), r=nz/planView.z;
    planView.x=e.clientX-(e.clientX-planView.x)*r;
    planView.y=e.clientY-(e.clientY-planView.y)*r;
    planView.z=nz;
  },{passive:false});
  let pd=false,lx=0,ly=0;
  pc.addEventListener('mousedown',e=>{pd=true;lx=e.clientX;ly=e.clientY;pc.style.cursor='grabbing';});
  addEventListener('mouseup',()=>{pd=false;pc.style.cursor='grab';});
  addEventListener('mousemove',e=>{
    if(!pd) return;
    planView.x+=e.clientX-lx; planView.y+=e.clientY-ly;
    lx=e.clientX; ly=e.clientY;
  });
  pc.addEventListener('dblclick',()=>{planView.z=1;planView.x=null;planView.y=null;});
  // touch: one finger pans, two fingers pinch-zoom
  let tD=null,tM=null;
  const dist=ts=>Math.hypot(ts[0].clientX-ts[1].clientX, ts[0].clientY-ts[1].clientY);
  const mid=ts=>[(ts[0].clientX+ts[1].clientX)/2,(ts[0].clientY+ts[1].clientY)/2];
  pc.addEventListener('touchstart',e=>{
    if(e.touches.length===2){tD=dist(e.touches);tM=mid(e.touches);}
    else if(e.touches.length===1){lx=e.touches[0].clientX;ly=e.touches[0].clientY;pd=true;}
    e.preventDefault();
  },{passive:false});
  pc.addEventListener('touchmove',e=>{
    if(e.touches.length===2&&tD){
      const nd=dist(e.touches), m=mid(e.touches);
      const nz=Math.max(0.5,Math.min(14,planView.z*nd/tD)), r=nz/planView.z;
      planView.x=m[0]-(m[0]-planView.x)*r;
      planView.y=m[1]-(m[1]-planView.y)*r;
      planView.z=nz; tD=nd;
    } else if(e.touches.length===1&&pd){
      planView.x+=e.touches[0].clientX-lx; planView.y+=e.touches[0].clientY-ly;
      lx=e.touches[0].clientX; ly=e.touches[0].clientY;
    }
    e.preventDefault();
  },{passive:false});
  pc.addEventListener('touchend',()=>{tD=null;pd=false;});
}
function drawPlan(){
  const pc=document.getElementById('plan'), g2=pc.getContext('2d');
  pc.width=innerWidth; pc.height=innerHeight;
  const X0=PLAN_X0,X1=PLAN_X1,Z0=PLAN_Z0,Z1=PLAN_Z1;
  const sc0=Math.min(innerWidth/(X1-X0), innerHeight/(Z1-Z0))*0.98;
  if(planView.x===null){
    planView.x=(innerWidth-(X1-X0)*sc0)/2;
    planView.y=(innerHeight-(Z1-Z0)*sc0)/2;
  }
  const sc=sc0*planView.z;
  const ox=planView.x, oy=planView.y;
  const cx=ft=>ox+(ft-X0)*sc, cy=ft=>oy+(ft-Z0)*sc;
  g2.fillStyle='#f7f4ee'; g2.fillRect(0,0,pc.width,pc.height);
  const img=planImgs[sheetOf()];
  if(img.complete&&img.naturalWidth) g2.drawImage(img,cx(X0),cy(Z0),(X1-X0)*sc,(Z1-Z0)*sc);
  // live model footprints from the 3D scene
  const MFT=0.3048;
  for(const m of world.children){
    const g=m.geometry; if(!g||!g.parameters) continue;
    const px=m.position.x/MFT, py=m.position.y/MFT, pz=m.position.z/MFT;
    if(g.type==='BoxGeometry'){
      if(Math.abs(m.rotation.z)>0.01) continue;
      const w=g.parameters.width*m.scale.x/MFT, h=g.parameters.height*m.scale.y/MFT,
            d=g.parameters.depth*m.scale.z/MFT;
      const y0=py-h/2, y1=py+h/2;
      let col=null,lw=2,dash=null;
      if(y0<=5&&5<=y1&&h>2){col='rgba(205,32,32,.95)';lw=2.5;}
      else if(h<0.45&&y0>2.2&&y1<3.4){col='rgba(232,138,20,.95)';}       // counter & table tops: solid
      else if(y1>0.2&&y1<4&&y0<1){col='rgba(232,138,20,.8)';dash=[5,4];} // bases: dashed
      if(col){ g2.strokeStyle=col; g2.lineWidth=lw;
        g2.setLineDash(dash||[]);
        g2.strokeRect(cx(px-w/2),cy(pz-d/2),w*sc,d*sc);
        g2.setLineDash([]); }
    } else if(g.type==='CylinderGeometry'){
      if(py<3.5&&g.parameters.radiusTop/MFT>0.3){
        g2.strokeStyle='rgba(40,95,215,.9)'; g2.lineWidth=2;
        const r=g.parameters.radiusTop/MFT;
        g2.beginPath();
        g2.ellipse(cx(px),cy(pz),r*Math.max(m.scale.x,1)*sc,r*Math.max(m.scale.z,1)*sc,0,0,7);
        g2.stroke();
      }
    }
  }
  // dimensions
  g2.font='600 11px system-ui'; g2.textAlign='center'; g2.textBaseline='middle';
  const dims=DIMS.shared.concat(DIMS[current]);
  for(const [x1,z1,x2,z2,label,off,vert] of dims){
    let ax,ay,bx,by,tx,ty;
    if(vert){ ax=cx(x1+off); ay=cy(z1); bx=ax; by=cy(z2); tx=ax-11; ty=(ay+by)/2; }
    else{ ax=cx(x1); ay=cy(z1+off); bx=cx(x2); by=ay; tx=(ax+bx)/2; ty=ay-9; }
    g2.strokeStyle='#b3261e'; g2.lineWidth=1.3;
    g2.beginPath(); g2.moveTo(ax,ay); g2.lineTo(bx,by);
    if(vert){ g2.moveTo(ax-4,ay); g2.lineTo(ax+4,ay); g2.moveTo(bx-4,by); g2.lineTo(bx+4,by); }
    else{ g2.moveTo(ax,ay-4); g2.lineTo(ax,ay+4); g2.moveTo(bx,by-4); g2.lineTo(bx,by+4); }
    g2.stroke();
    g2.save();
    g2.translate(tx,ty); if(vert) g2.rotate(-Math.PI/2);
    g2.lineWidth=3.5; g2.strokeStyle='rgba(247,244,238,.92)';
    g2.strokeText(label,0,0);
    g2.fillStyle='#b3261e'; g2.fillText(label,0,0);
    g2.restore();
  }
  // your position
  const fx=pos.x/MFT, fz=pos.z/MFT;
  g2.fillStyle='#e33b2e';
  g2.beginPath(); g2.arc(cx(fx),cy(fz),6,0,7); g2.fill();
  g2.strokeStyle='#e33b2e'; g2.lineWidth=2.5;
  g2.beginPath(); g2.moveTo(cx(fx),cy(fz));
  g2.lineTo(cx(fx)+Math.sin(yaw+Math.PI)*16, cy(fz)+Math.cos(yaw+Math.PI)*16);
  g2.stroke();
  // legend
  g2.textAlign='left'; g2.font='600 11px system-ui';
  const L=[['#cd2020','model walls'],['#e88a14','cabinets / built-ins'],['#285fd7','seats'],['#555','reference drawing']];
  L.forEach((l,i)=>{ g2.fillStyle=l[0]; g2.fillRect(14,pc.height-20-i*18,10,10);
    g2.fillStyle='#3a3630'; g2.fillText(l[1],30,pc.height-15-i*18); });
}

init();
</script>
</body>
</html>
